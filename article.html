<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Old Strike Website News — Статья</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #202126;
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('Icons/OS_logo.png');
            background-repeat: repeat;
            background-size: 80px 80px;
            background-position: 0 0;
            opacity: 0.06;
            pointer-events: none;
            z-index: 0;
            animation: scrollBg 30s linear infinite;
        }
        @keyframes scrollBg {
            0% { background-position: 0 0; }
            100% { background-position: 300px -300px; }
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: #3A3F45;
            border: 1px solid #363940;
            padding: 30px;
            margin: 20px auto;
            animation: fadeIn 0.5s ease;
            position: relative;
            z-index: 1;
        }
        .back-btn {
            display: inline-block;
            color: #FFFFFF;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: color 0.3s;
            padding: 6px 14px;
            border: 1px solid #363940;
            background: #202126;
        }
        .back-btn:hover {
            background: #363940;
            border-color: #FFFFFF;
        }
        .article-date {
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
        }
        .article-title {
            font-size: 28px;
            font-weight: 700;
            margin: 10px 0 16px;
        }
        .article-author {
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .article-text p {
            color: #FFFFFF;
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 12px;
        }
        .inline-image {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            margin: 12px 0;
            border: 1px solid #363940;
            background: #202126;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 767px) {
            .container { padding: 20px; margin: 10px; }
            .article-title { font-size: 22px; }
            .article-text p { font-size: 15px; }
            .inline-image { max-height: 250px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="back-btn" onclick="history.back()">← Назад к новостям</div>
    <div id="articleContent">
        <div style="text-align:center;color:#ffffff;padding:40px 0;">Загрузка статьи...</div>
    </div>
</div>

<script>
    // ===== ФУНКЦИЯ ДЛЯ КАРТИНОК В ТЕКСТЕ =====
    function formatTextWithImages(text) {
        if (!text) return '';
        
        const lines = text.split('\n');
        let html = '';
        
        for (let line of lines) {
            const trimmed = line.trim();
            if (trimmed.startsWith('img:')) {
                const imagePath = trimmed.replace('img:', '').trim();
                html += `<img class="inline-image" src="${imagePath}" alt="Изображение" onerror="this.style.display='none'">`;
            } else if (trimmed === '') {
                html += `<br>`;
            } else {
                html += `<p>${trimmed}</p>`;
            }
        }
        
        return html;
    }

    async function loadArticle() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        
        if (!id) {
            document.getElementById('articleContent').innerHTML = `
                <div style="text-align:center;color:#ffffff;">ID статьи не указан</div>
            `;
            return;
        }
        
        try {
            const res = await fetch(`News/${id}.json`);
            if (!res.ok) throw new Error('Статья не найдена');
            const data = await res.json();
            
            document.getElementById('articleContent').innerHTML = `
                <div class="article-date">${data.date}</div>
                <div class="article-title">${data.title}</div>
                <div class="article-author">${data.author}</div>
                <div class="article-text">${formatTextWithImages(data.fullText)}</div>
            `;
            
            document.title = `${data.title} — OSNW`;
        } catch (error) {
            document.getElementById('articleContent').innerHTML = `
                <div style="text-align:center;color:#ffffff;">
                    Статья не найдена<br>
                    <span style="font-size:13px;color:#FFFFFF;">Файл News/${id}.json отсутствует</span>
                </div>
            `;
        }
    }
    
    loadArticle();
</script>
</body>
</html>
