<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>UV Tuner — OSNW</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; background: #202126; overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif; color: #fff;
            display: flex; height: 100vh;
        }
        #canvas-container { flex: 1; position: relative; }
        #panel {
            width: 260px; background: #18191c; border-left: 2px solid #2D3037;
            overflow-y: auto; padding: 10px; font-size: 11px;
        }
        .part-block {
            background: #202126; border: 1px solid #2D3037;
            border-radius: 4px; margin-bottom: 8px; padding: 8px;
        }
        .part-title {
            font-weight: 600; color: #FFD700; margin-bottom: 6px;
            font-size: 12px; display: flex; justify-content: space-between;
        }
        .part-title .toggle { cursor: pointer; color: #6a8aff; }
        .part-body { display: none; }
        .part-body.open { display: block; }
        .row {
            display: flex; align-items: center; gap: 6px;
            margin-bottom: 4px;
        }
        .row label { width: 30px; color: #888; font-size: 10px; }
        .row input[type="range"] { flex: 1; height: 16px; }
        .row .val {
            width: 48px; text-align: right; font-family: monospace;
            color: #6a8aff; font-size: 10px;
        }
        .btns {
            position: fixed; bottom: 12px; left: 50%;
            transform: translateX(-50%); display: flex; gap: 8px;
            z-index: 100; flex-wrap: wrap; justify-content: center;
        }
        .btn {
            background: #2D3037; color: #fff; border: 2px solid #444;
            padding: 8px 14px; font-size: 12px; font-family: inherit;
            cursor: pointer;
        }
        .btn.active {
            background: #FFD700; color: #202126; border-color: #FFD700;
        }
        .btn.save {
            background: #6a8aff; border-color: #6a8aff; color: #202126;
            font-weight: 600;
        }
        #debug {
            position: fixed; top: 8px; left: 8px;
            color: #6a8aff; font-size: 10px;
            font-family: monospace; background: rgba(0,0,0,0.6);
            padding: 6px 8px; border-radius: 4px;
            pointer-events: none; max-width: 200px; line-height: 1.3;
        }
        #loading {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #FFD700; font-size: 14px; z-index: 200;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="debug"></div>
    <div id="loading">Загрузка...</div>
    <div id="panel"></div>
    <div class="btns" id="btns"></div>

    <script type="importmap">
    { "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }}
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

        const debugEl = document.getElementById('debug');
        const panelEl = document.getElementById('panel');
        const btnsEl = document.getElementById('btns');
        const loadingEl = document.getElementById('loading');

        // ===== Скины (спрайты в атласе) =====
        const ATLAS_SIZE = 2048;
        const SKINS = {
            0: { name: '1-0', x: 300, y: 735, w: 128, h: 128 },
            1: { name: '1-1', x: 300, y: 705, w: 128, h: 128 },
            2: { name: '1-2', x: 300, y: 675, w: 128, h: 128 },
        };
        let currentSkin = 0;

        // ===== Параметры UV для каждой части =====
        // Начальные значения — нейтральные
        const PARTS = ['Object001','Object002','Object003','Object004','Object005','Object006','Object007','Object008','Object009'];
        const uvParams = {};
        PARTS.forEach(name => {
            uvParams[name] = {
                tu: 1.0, tv: 1.0,  // Tiling
                ou: 0.0, ov: 0.0,  // Offset
                enabled: false,
            };
        });

        // ===== Сцена =====
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x202126);

        const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 1000);
        camera.position.set(0, 0, 4);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.1;
        controls.enablePan = false;

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const d1 = new THREE.DirectionalLight(0xffffff, 0.7); d1.position.set(2, 3, 2); scene.add(d1);
        const d2 = new THREE.DirectionalLight(0xffffff, 0.4); d2.position.set(-2, -1, -2); scene.add(d2);

        // ===== Атлас =====
        const atlasTexture = new THREE.TextureLoader().load(
            'Data/3D/WeaponsAtlas.png',
            () => { debugEl.textContent = `Атлас ${atlasTexture.image.width}×${atlasTexture.image.height}`; },
            undefined,
            (err) => { debugEl.textContent = 'Ошибка атласа'; }
        );
        atlasTexture.colorSpace = THREE.SRGBColorSpace;
        atlasTexture.flipY = false;

        // ===== Модель =====
        const BASE = 'Data/3D/Weapon/AK-47/';
        const loader = new OBJLoader();
        const group = new THREE.Group();
        let loaded = 0;

        PARTS.forEach(partName => {
            loader.load(
                BASE + partName + '.obj',
                (obj) => {
                    obj.traverse(child => {
                        if (child.isMesh && child.geometry) {
                            child.material = new THREE.MeshStandardMaterial({
                                map: atlasTexture,
                                metalness: 0.2, roughness: 0.7,
                                side: THREE.DoubleSide
                            });
                            const uvAttr = child.geometry.attributes.uv;
                            if (uvAttr) {
                                child.userData.originalUV = new Float32Array(uvAttr.array);
                                child.userData.partName = partName;
                            }
                        }
                    });
                    group.add(obj);
                    loaded++;
                    loadingEl.textContent = `Загрузка: ${loaded}/${PARTS.length}`;
                    if (loaded === PARTS.length) onAllLoaded();
                },
                undefined,
                (err) => {
                    loaded++;
                    if (loaded === PARTS.length) onAllLoaded();
                }
            );
        });

        function onAllLoaded() {
            loadingEl.style.display = 'none';
            const box = new THREE.Box3().setFromObject(group);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            group.position.sub(center);
            group.scale.setScalar(3.0 / maxDim);
            scene.add(group);
            camera.position.set(0, 0, 4);
            controls.target.set(0, 0, 0);
            controls.update();
            applyAllUV();
            buildPanel();
            buildSkinButtons();
        }

        // ===== Пересчёт UV =====
        function applyAllUV() {
            group.traverse(child => {
                if (!child.isMesh || !child.geometry) return;
                const origUV = child.userData.originalUV;
                const partName = child.userData.partName;
                if (!origUV || !partName) return;

                const p = uvParams[partName];
                const uvAttr = child.geometry.attributes.uv;

                if (!p.enabled) {
                    // Просто копируем оригинал
                    for (let i = 0; i < uvAttr.count; i++) {
                        uvAttr.setXY(i, origUV[i*2], origUV[i*2+1]);
                    }
                } else {
                    // Считаем min/max UV этой части
                    let uMin = Infinity, uMax = -Infinity, vMin = Infinity, vMax = -Infinity;
                    for (let i = 0; i < origUV.length; i += 2) {
                        const u = origUV[i], v = origUV[i+1];
                        if (u < uMin) uMin = u;
                        if (u > uMax) uMax = u;
                        if (v < vMin) vMin = v;
                        if (v > vMax) vMax = v;
                    }
                    const uRange = uMax - uMin || 0.0001;
                    const vRange = vMax - vMin || 0.0001;

                    for (let i = 0; i < uvAttr.count; i++) {
                        const u0 = (origUV[i*2] - uMin) / uRange;
                        const v0 = (origUV[i*2+1] - vMin) / vRange;
                        uvAttr.setXY(i, u0 * p.tu + p.ou, v0 * p.tv + p.ov);
                    }
                }
                uvAttr.needsUpdate = true;
            });
        }

        // ===== Панель со слайдерами =====
        function buildPanel() {
            panelEl.innerHTML = '';
            PARTS.forEach(name => {
                const p = uvParams[name];
                const block = document.createElement('div');
                block.className = 'part-block';
                block.innerHTML = `
                    <div class="part-title">
                        <span>${name}</span>
                        <span class="toggle">${p.enabled ? '−' : '+'}</span>
                    </div>
                    <div class="part-body ${p.enabled ? 'open' : ''}"></div>
                `;
                const body = block.querySelector('.part-body');

                const mkRow = (label, key, min, max, step) => {
                    const row = document.createElement('div');
                    row.className = 'row';
                    row.innerHTML = `
                        <label>${label}</label>
                        <input type="range" min="${min}" max="${max}" step="${step}" value="${p[key]}">
                        <span class="val">${p[key].toFixed(3)}</span>
                    `;
                    const input = row.querySelector('input');
                    const val = row.querySelector('.val');
                    input.addEventListener('input', () => {
                        p[key] = parseFloat(input.value);
                        val.textContent = p[key].toFixed(3);
                        applyAllUV();
                    });
                    return row;
                };

                body.appendChild(mkRow('TU', 'tu', 0, 2, 0.001));
                body.appendChild(mkRow('TV', 'tv', 0, 2, 0.001));
                body.appendChild(mkRow('OU', 'ou', -1, 1, 0.001));
                body.appendChild(mkRow('OV', 'ov', -1, 1, 0.001));

                block.querySelector('.toggle').addEventListener('click', () => {
                    p.enabled = !p.enabled;
                    buildPanel();
                    applyAllUV();
                });

                panelEl.appendChild(block);
            });

            // Кнопка сброса
            const resetBtn = document.createElement('button');
            resetBtn.className = 'btn';
            resetBtn.textContent = 'Сброс всех';
            resetBtn.style.width = '100%';
            resetBtn.style.marginTop = '8px';
            resetBtn.addEventListener('click', () => {
                PARTS.forEach(name => {
                    uvParams[name] = { tu: 1, tv: 1, ou: 0, ov: 0, enabled: false };
                });
                buildPanel();
                applyAllUV();
            });
            panelEl.appendChild(resetBtn);
        }

        // ===== Кнопки скинов =====
        function buildSkinButtons() {
            btnsEl.innerHTML = '';
            Object.entries(SKINS).forEach(([idx, skin]) => {
                const btn = document.createElement('button');
                btn.className = 'btn' + (parseInt(idx) === currentSkin ? ' active' : '');
                btn.textContent = skin.name;
                btn.addEventListener('click', () => {
                    currentSkin = parseInt(idx);
                    buildSkinButtons();
                    // Обновляем offset, чтобы показать другой спрайт
                    // Пока просто меняем общий offset в атласе
                    const sprite = SKINS[currentSkin];
                    const uOff = sprite.x / ATLAS_SIZE;
                    const vOff = 1.0 - (sprite.y + sprite.h) / ATLAS_SIZE;
                    // Пока не трогаем texture.offset — оставим для ручного подбора
                    applyAllUV();
                });
                btnsEl.appendChild(btn);
            });

            const saveBtn = document.createElement('button');
            saveBtn.className = 'btn save';
            saveBtn.textContent = 'Сохранить в консоль';
            saveBtn.addEventListener('click', () => {
                const dump = {};
                PARTS.forEach(name => {
                    const p = uvParams[name];
                    if (p.enabled) {
                        dump[name] = {
                            tu: +p.tu.toFixed(4),
                            tv: +p.tv.toFixed(4),
                            ou: +p.ou.toFixed(4),
                            ov: +p.ov.toFixed(4),
                        };
                    }
                });
                console.log('=== UV PARAMS ===');
                console.log(JSON.stringify(dump, null, 2));
                debugEl.textContent = 'Параметры в консоли';
                setTimeout(() => {
                    debugEl.textContent = '';
                }, 2000);
            });
            btnsEl.appendChild(saveBtn);
        }

        // ===== Ресайз =====
        function resize() {
            const canvas = document.getElementById('canvas-container');
            const w = canvas.clientWidth, h = canvas.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h, false);
        }
        addEventListener('resize', resize);

        // ===== Анимация =====
        (function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        })();

        // Стартовый ресайз после загрузки
        setTimeout(resize, 100);
        new ResizeObserver(resize).observe(document.getElementById('canvas-container'));
    </script>
</body>
</html>
