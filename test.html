<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Test — OSNW</title>
    <style>
        body {
            margin: 0;
            background: #202126;
            overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #info {
            position: fixed;
            top: 16px;
            left: 16px;
            color: #FFD700;
            font-size: 14px;
            z-index: 100;
            pointer-events: none;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #FFD700;
            font-size: 18px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="info">3D TEST — Object001</div>
    <div id="loading">Загрузка модели...</div>
    <div id="canvas-container"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

        // === Сцена ===
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x202126);

        // === Камера ===
        const camera = new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            0.01,
            1000
        );
        camera.position.set(0, 0, 1.5);

        // === Рендерер ===
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // === Управление (вращение пальцем) ===
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.1;
        controls.enablePan = false;
        controls.minDistance = 0.5;
        controls.maxDistance = 5;

        // === Свет ===
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(1, 2, 1);
        scene.add(dirLight);

        const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
        dirLight2.position.set(-1, -1, -1);
        scene.add(dirLight2);

        // === Загрузка модели ===
        const loader = new OBJLoader();
        const MODEL_URL = 'Data/3D/Weapons/AK-47/Object001.obj';  // ← поменяй путь

        loader.load(
            MODEL_URL,
            (obj) => {
                console.log('Модель загружена', obj);
                document.getElementById('loading').style.display = 'none';

                // Материал — пока белый, потом заменим на атлас
                obj.traverse((child) => {
                    if (child.isMesh) {
                        child.material = new THREE.MeshStandardMaterial({
                            color: 0xaaaaaa,
                            metalness: 0.3,
                            roughness: 0.6,
                            side: THREE.DoubleSide
                        });
                    }
                });

                // Центрируем и масштабируем
                const box = new THREE.Box3().setFromObject(obj);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = 1.0 / maxDim;

                obj.position.sub(center);       // центрируем
                obj.scale.setScalar(scale);     // масштабируем в 1 unit

                scene.add(obj);

                // Настраиваем камеру под размер
                camera.position.set(0, 0, 1.5);
                controls.target.set(0, 0, 0);
                controls.update();
            },
            (xhr) => {
                const pct = Math.round((xhr.loaded / xhr.total) * 100);
                document.getElementById('loading').textContent = `Загрузка: ${pct}%`;
            },
            (err) => {
                console.error('Ошибка загрузки:', err);
                document.getElementById('loading').textContent = 'Ошибка загрузки модели';
            }
        );

        // === Ресайз ===
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // === Анимация ===
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
