<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Test — OSNW</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #202126; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; color: #fff; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; }
        #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #FFD700; font-size: 16px; z-index: 100; text-align: center; }
        #debug { position: fixed; top: 16px; left: 16px; color: #6a8aff; font-size: 10px; font-family: monospace; z-index: 100; pointer-events: none; white-space: pre; background: rgba(0,0,0,0.6); padding: 6px 10px; border-radius: 4px; max-width: 95vw; max-height: 50vh; overflow: hidden; line-height: 1.3; }
        #skin-bar { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 100; flex-wrap: wrap; justify-content: center; padding: 0 16px; }
        .skin-btn { background: #2D3037; color: #fff; border: 2px solid #444; padding: 8px 16px; font-size: 13px; font-family: inherit; cursor: pointer; transition: all 0.2s; min-width: 90px; }
        .skin-btn.active { background: #FFD700; color: #202126; border-color: #FFD700; font-weight: 600; }
    </style>
</head>
<body>
    <div id="loading">Загрузка...</div>
    <div id="debug"></div>
    <div id="canvas-container"></div>
    <div id="skin-bar">
        <button class="skin-btn active" data-skin="0">Skin 1</button>
        <button class="skin-btn" data-skin="1">Skin 2</button>
        <button class="skin-btn" data-skin="2">Skin 3</button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

        const debugEl = document.getElementById('debug');
        function log(msg) {
            debugEl.textContent += msg + '\n';
            console.log(msg);
        }
        function clearLog() { debugEl.textContent = ''; }

        // ===== АТЛАС =====
        const ATLAS_SIZE = 2048;
        const SKINS = {
            0: { name: '1-0', x: 300, y: 735, w: 128, h: 128 },
            1: { name: '1-1', x: 300, y: 705, w: 128, h: 128 },
            2: { name: '1-2', x: 300, y: 675, w: 128, h: 128 },
        };

        // ===== СЦЕНА =====
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x202126);

        const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 1000);
        camera.position.set(0, 0, 4);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.1;
        controls.enablePan = false;

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const d1 = new THREE.DirectionalLight(0xffffff, 0.7); d1.position.set(2, 3, 2); scene.add(d1);
        const d2 = new THREE.DirectionalLight(0xffffff, 0.4); d2.position.set(-2, -1, -2); scene.add(d2);

        // ===== АТЛАС =====
        const atlasTexture = new THREE.TextureLoader().load(
            'Data/3D/WeaponsAtlas.png',
            () => log(`Атлас: ${atlasTexture.image.width}×${atlasTexture.image.height}`),
            undefined,
            (err) => log('ОШИБКА атласа: ' + err)
        );
        atlasTexture.colorSpace = THREE.SRGBColorSpace;
        atlasTexture.flipY = false;

        // ===== МОДЕЛЬ =====
        const PARTS = ['Object001','Object002','Object003','Object004','Object005','Object006','Object007','Object008','Object009'];
        const BASE = 'Data/3D/Weapon/AK-47/';
        const loader = new OBJLoader();
        const group = new THREE.Group();
        let loaded = 0;

        PARTS.forEach((partName) => {
            loader.load(
                BASE + partName + '.obj',
                (obj) => {
                    obj.traverse((child) => {
                        if (child.isMesh && child.geometry) {
                            child.material = new THREE.MeshStandardMaterial({
                                map: atlasTexture,
                                metalness: 0.2,
                                roughness: 0.7,
                                side: THREE.DoubleSide
                            });
                            // Сохраняем UV прямо на меш
                            const uvAttr = child.geometry.attributes.uv;
                            if (uvAttr) {
                                child.userData.originalUV = new Float32Array(uvAttr.array);
                                child.userData.partName = partName;
                            }
                        }
                    });
                    group.add(obj);
                    loaded++;
                    document.getElementById('loading').textContent = `Загрузка: ${loaded}/${PARTS.length}`;
                    if (loaded === PARTS.length) onAllLoaded();
                },
                undefined,
                (err) => {
                    log('ОШИБКА: ' + partName);
                    loaded++;
                    if (loaded === PARTS.length) onAllLoaded();
                }
            );
        });

        function onAllLoaded() {
            document.getElementById('loading').style.display = 'none';

            const box = new THREE.Box3().setFromObject(group);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            group.position.sub(center);
            group.scale.setScalar(3.0 / maxDim);

            scene.add(group);
            camera.position.set(0, 0, 4);
            controls.target.set(0, 0, 0);
            controls.update();

            applySkin(0);
        }

        // ===== ПЕРЕСЧЁТ UV =====
        function applySkin(skinIdx) {
            clearLog();
            const sprite = SKINS[skinIdx];
            if (!sprite) return;

            const u_sprite = sprite.x / ATLAS_SIZE;
            const v_sprite = sprite.y / ATLAS_SIZE;
            const u_size = sprite.w / ATLAS_SIZE;
            const v_size = sprite.h / ATLAS_SIZE;

            log(`Скин: ${sprite.name}`);
            log(`sprite: u=${u_sprite.toFixed(3)} v=${v_sprite.toFixed(3)} size=${u_size.toFixed(3)}×${v_size.toFixed(3)}`);
            log('---');

            group.traverse((child) => {
                if (!child.isMesh || !child.geometry) return;

                const origUV = child.userData.originalUV;
                const partName = child.userData.partName || '?';
                if (!origUV) {
                    log(`${partName}: нет UV`);
                    return;
                }

                // Считаем min/max UV этой части
                let uMin = Infinity, uMax = -Infinity, vMin = Infinity, vMax = -Infinity;
                for (let i = 0; i < origUV.length; i += 2) {
                    const u = origUV[i];
                    const v = origUV[i + 1];
                    if (u < uMin) uMin = u;
                    if (u > uMax) uMax = u;
                    if (v < vMin) vMin = v;
                    if (v > vMax) vMax = v;
                }

                const uRange = uMax - uMin || 0.0001;
                const vRange = vMax - vMin || 0.0001;

                log(`${partName}: U[${uMin.toFixed(2)},${uMax.toFixed(2)}] V[${vMin.toFixed(2)},${vMax.toFixed(2)}]`);

                // Пересчитываем UV
                const uvAttr = child.geometry.attributes.uv;
                for (let i = 0; i < uvAttr.count; i++) {
                    const u0 = origUV[i * 2];
                    const v0 = origUV[i * 2 + 1];
                    const uNorm = (u0 - uMin) / uRange;
                    const vNorm = (v0 - vMin) / vRange;
                    uvAttr.setXY(i, uNorm * u_size + u_sprite, vNorm * v_size + v_sprite);
                }
                uvAttr.needsUpdate = true;
            });
        }

        // ===== КНОПКИ =====
        document.querySelectorAll('.skin-btn').forEach((btn) => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.skin-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                applySkin(parseInt(btn.dataset.skin, 10));
            });
        });

        // ===== РЕСАЙЗ И АНИМАЦИЯ =====
        addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });

        (function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        })();
    </script>
</body>
</html>
