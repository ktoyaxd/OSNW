<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>UV Tuner — OSNW</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
    margin: 0; background: #202126; overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif; color: #fff;
    display: flex; flex-direction: column; height: 100vh;
}
#canvas-container { flex: 1; position: relative; min-height: 0; }
#panel {
    height: 40vh; background: #18191c; border-top: 2px solid #2D3037;
    overflow-y: auto; padding: 8px; font-size: 11px;
}
        .part-tabs {
            display: grid; grid-template-columns: repeat(5, 1fr);
            gap: 4px; margin-bottom: 8px;
        }
        .tab {
            background: #202126; border: 1px solid #2D3037;
            color: #888; padding: 6px 0; text-align: center;
            font-size: 10px; cursor: pointer; border-radius: 3px;
        }
        .tab.active {
            background: #FFD700; color: #202126;
            border-color: #FFD700; font-weight: 600;
        }
        .row {
            display: flex; align-items: center; gap: 6px;
            margin-bottom: 8px;
        }
        .row label {
            width: 32px; color: #888; font-size: 10px;
        }
        .row input[type="range"] { flex: 1; height: 20px; }
        .row .val {
            width: 50px; text-align: right; font-family: monospace;
            color: #6a8aff; font-size: 10px;
        }
        .btn {
            background: #2D3037; color: #fff; border: 2px solid #444;
            padding: 8px 14px; font-size: 12px; font-family: inherit;
            cursor: pointer;
        }
        .btn.active {
            background: #FFD700; color: #202126; border-color: #FFD700;
        }
        .btns {
            position: fixed; bottom: 12px; left: 50%;
            transform: translateX(-50%); display: flex; gap: 8px;
            z-index: 100; flex-wrap: wrap; justify-content: center;
        }
        #debug {
            position: fixed; top: 8px; left: 8px;
            color: #6a8aff; font-size: 10px;
            font-family: monospace; background: rgba(0,0,0,0.6);
            padding: 6px 8px; border-radius: 4px;
            pointer-events: none; max-width: 180px; line-height: 1.3;
        }
        #loading {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #FFD700; font-size: 14px; z-index: 200;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="debug"></div>
    <div id="loading">Загрузка...</div>
    <div id="panel"></div>
    <div class="btns" id="btns"></div>

    <script type="importmap">
    { "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }}
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

        const debugEl = document.getElementById('debug');
        const panelEl = document.getElementById('panel');
        const btnsEl = document.getElementById('btns');
        const loadingEl = document.getElementById('loading');

        const ATLAS_SIZE = 2048;
        const SKINS = {
            0: { name: '1-0', x: 300, y: 735, w: 128, h: 128 },
            1: { name: '1-1', x: 300, y: 705, w: 128, h: 128 },
            2: { name: '1-2', x: 300, y: 675, w: 128, h: 128 },
        };
        let currentSkin = 0;

        const PARTS = ['Object001','Object002','Object003','Object004','Object005','Object006','Object007','Object008','Object009'];
        const uvParams = {};
        PARTS.forEach(name => {
            uvParams[name] = { tu: 1, tv: 1, ou: 0, ov: 0, enabled: false };
        });

        // Какая часть сейчас редактируется ("ALL" или имя)
        let activePart = 'ALL';
        // Меши по частям — для быстрого доступа
        const meshesByPart = {};

        // ===== Сцена =====
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x202126);

        const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 1000);
        camera.position.set(0, 0, 4);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); // снизили до 1.5 — меньше нагрузки
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.1;
        controls.enablePan = false;

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const d1 = new THREE.DirectionalLight(0xffffff, 0.7); d1.position.set(2, 3, 2); scene.add(d1);
        const d2 = new THREE.DirectionalLight(0xffffff, 0.4); d2.position.set(-2, -1, -2); scene.add(d2);

        const atlasTexture = new THREE.TextureLoader().load(
            'Data/3D/WeaponsAtlas.png',
            () => { debugEl.textContent = `Атлас ${atlasTexture.image.width}×${atlasTexture.image.height}`; },
            undefined,
            () => { debugEl.textContent = 'Ошибка атласа'; }
        );
        atlasTexture.colorSpace = THREE.SRGBColorSpace;
        atlasTexture.flipY = false;

        // ===== Модель =====
        const BASE = 'Data/3D/Weapon/AK-47/';
        const loader = new OBJLoader();
        const group = new THREE.Group();
        let loaded = 0;

        PARTS.forEach(partName => {
            loader.load(
                BASE + partName + '.obj',
                (obj) => {
                    obj.traverse(child => {
                        if (child.isMesh && child.geometry) {
                            child.material = new THREE.MeshStandardMaterial({
                                map: atlasTexture,
                                metalness: 0.2, roughness: 0.7,
                                side: THREE.DoubleSide
                            });
                            const uvAttr = child.geometry.attributes.uv;
                            if (uvAttr) {
                                child.userData.originalUV = new Float32Array(uvAttr.array);
                                child.userData.partName = partName;
                                if (!meshesByPart[partName]) meshesByPart[partName] = [];
                                meshesByPart[partName].push(child);
                            }
                        }
                    });
                    group.add(obj);
                    loaded++;
                    loadingEl.textContent = `Загрузка: ${loaded}/${PARTS.length}`;
                    if (loaded === PARTS.length) onAllLoaded();
                },
                undefined,
                () => {
                    loaded++;
                    if (loaded === PARTS.length) onAllLoaded();
                }
            );
        });

        function onAllLoaded() {
            loadingEl.style.display = 'none';
            const box = new THREE.Box3().setFromObject(group);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            group.position.sub(center);
            group.scale.setScalar(3.0 / maxDim);
            scene.add(group);
            camera.position.set(0, 0, 4);
            controls.target.set(0, 0, 0);
            controls.update();
            applyAllUV();
            buildPanel();
            buildSkinButtons();
            resize();
        }

        // ===== Пересчёт UV для одной части =====
        function applyUVToMesh(child) {
            const origUV = child.userData.originalUV;
            const partName = child.userData.partName;
            if (!origUV || !partName) return;
            const p = uvParams[partName];
            const uvAttr = child.geometry.attributes.uv;

            if (!p.enabled) {
                uvAttr.array.set(origUV);
            } else {
                let uMin = Infinity, uMax = -Infinity, vMin = Infinity, vMax = -Infinity;
                for (let i = 0; i < origUV.length; i += 2) {
                    const u = origUV[i], v = origUV[i+1];
                    if (u < uMin) uMin = u;
                    if (u > uMax) uMax = u;
                    if (v < vMin) vMin = v;
                    if (v > vMax) vMax = v;
                }
                const uRange = uMax - uMin || 0.0001;
                const vRange = vMax - vMin || 0.0001;

                for (let i = 0; i < uvAttr.count; i++) {
                    const u0 = (origUV[i*2] - uMin) / uRange;
                    const v0 = (origUV[i*2+1] - vMin) / vRange;
                    uvAttr.setXY(i, u0 * p.tu + p.ou, v0 * p.tv + p.ov);
                }
            }
            uvAttr.needsUpdate = true;
        }

        // ===== Пересчёт UV всех видимых частей =====
        function applyAllUV() {
            if (activePart === 'ALL') {
                group.traverse(child => {
                    if (child.isMesh) applyUVToMesh(child);
                });
            } else {
                (meshesByPart[activePart] || []).forEach(applyUVToMesh);
            }
        }

        // ===== Панель =====
        function buildPanel() {
            panelEl.innerHTML = '';

            // Табы выбора части
            const tabs = document.createElement('div');
            tabs.className = 'part-tabs';
            ['001','002','003','004','005','006','007','008','009','ALL'].forEach(p => {
                const t = document.createElement('div');
                t.className = 'tab' + (activePart === (p === 'ALL' ? 'ALL' : 'Object' + p) ? ' active' : '');
                t.textContent = p;
                t.addEventListener('click', () => {
                    activePart = (p === 'ALL' ? 'ALL' : 'Object' + p);
                    // Показать только эту часть (или все)
                    PARTS.forEach(name => {
                        const meshes = meshesByPart[name] || [];
                        meshes.forEach(m => {
                            m.visible = (activePart === 'ALL' || name === activePart);
                        });
                    });
                    applyAllUV();
                    buildPanel();
                });
                tabs.appendChild(t);
            });
            panelEl.appendChild(tabs);

            // Если ALL — ничего больше не показываем
            if (activePart === 'ALL') {
                const hint = document.createElement('div');
                hint.style.color = '#888';
                hint.style.fontSize = '11px';
                hint.style.padding = '8px 4px';
                hint.textContent = 'Выбери часть (001–009), чтобы настроить её UV.';
                panelEl.appendChild(hint);
                return;
            }

            // Иначе — слайдеры для одной части
            const name = activePart;
            const p = uvParams[name];

            // Кнопка вкл/выкл
            const toggleBtn = document.createElement('button');
            toggleBtn.className = 'btn' + (p.enabled ? ' active' : '');
            toggleBtn.textContent = p.enabled ? 'Включено' : 'Выключено';
            toggleBtn.style.width = '100%';
            toggleBtn.style.marginBottom = '8px';
            toggleBtn.addEventListener('click', () => {
                p.enabled = !p.enabled;
                applyAllUV();
                buildPanel();
            });
            panelEl.appendChild(toggleBtn);

            // Слайдеры
            const mkRow = (label, key, min, max, step) => {
                const row = document.createElement('div');
                row.className = 'row';
                const valText = p[key].toFixed(3);
                row.innerHTML = `
                    <label>${label}</label>
                    <input type="range" min="${min}" max="${max}" step="${step}" value="${p[key]}">
                    <span class="val">${valText}</span>
                `;
                const input = row.querySelector('input');
                const val = row.querySelector('.val');
                // НЕ на input, а на change — чтобы не пересчитывать на каждое движение
                input.addEventListener('change', () => {
                    p[key] = parseFloat(input.value);
                    val.textContent = p[key].toFixed(3);
                    applyAllUV();
                });
                input.addEventListener('input', () => {
                    val.textContent = parseFloat(input.value).toFixed(3);
                });
                return row;
            };

            panelEl.appendChild(mkRow('TU', 'tu', 0, 2, 0.001));
            panelEl.appendChild(mkRow('TV', 'tv', 0, 2, 0.001));
            panelEl.appendChild(mkRow('OU', 'ou', -1, 1, 0.001));
            panelEl.appendChild(mkRow('OV', 'ov', -1, 1, 0.001));

            // Кнопка сброса
            const resetBtn = document.createElement('button');
            resetBtn.className = 'btn';
            resetBtn.textContent = 'Сбросить часть';
            resetBtn.style.width = '100%';
            resetBtn.style.marginTop = '8px';
            resetBtn.addEventListener('click', () => {
                uvParams[name] = { tu: 1, tv: 1, ou: 0, ov: 0, enabled: false };
                applyAllUV();
                buildPanel();
            });
            panelEl.appendChild(resetBtn);

            // Подсказка с текущими значениями
            const hint = document.createElement('div');
            hint.style.marginTop = '8px';
            hint.style.fontSize = '10px';
            hint.style.color = '#6a8aff';
            hint.style.fontFamily = 'monospace';
            hint.style.whiteSpace = 'pre-line';
            hint.textContent = `${name}\ntu=${p.tu.toFixed(4)} tv=${p.tv.toFixed(4)}\nou=${p.ou.toFixed(4)} ov=${p.ov.toFixed(4)}`;
            panelEl.appendChild(hint);
        }

        // ===== Кнопки скинов =====
        function buildSkinButtons() {
            btnsEl.innerHTML = '';
            Object.entries(SKINS).forEach(([idx, skin]) => {
                const btn = document.createElement('button');
                btn.className = 'btn' + (parseInt(idx) === currentSkin ? ' active' : '');
                btn.textContent = skin.name;
                btn.addEventListener('click', () => {
                    currentSkin = parseInt(idx);
                    buildSkinButtons();
                });
                btnsEl.appendChild(btn);
            });

            const saveBtn = document.createElement('button');
            saveBtn.className = 'btn';
            saveBtn.style.background = '#6a8aff';
            saveBtn.style.borderColor = '#6a8aff';
            saveBtn.style.color = '#202126';
            saveBtn.style.fontWeight = '600';
            saveBtn.textContent = 'Save';
            saveBtn.addEventListener('click', () => {
                const dump = {};
                PARTS.forEach(name => {
                    const p = uvParams[name];
                    if (p.enabled) {
                        dump[name] = {
                            tu: +p.tu.toFixed(4),
                            tv: +p.tv.toFixed(4),
                            ou: +p.ou.toFixed(4),
                            ov: +p.ov.toFixed(4),
                        };
                    }
                });
                const txt = JSON.stringify(dump, null, 2);
                console.log('=== UV PARAMS ===');
                console.log(txt);
                debugEl.textContent = 'Параметры в консоли';
                setTimeout(() => { debugEl.textContent = ''; }, 2000);
            });
            btnsEl.appendChild(saveBtn);
        }

        // ===== Ресайз =====
        function resize() {
            const canvas = document.getElementById('canvas-container');
            const w = canvas.clientWidth, h = canvas.clientHeight;
            if (w === 0 || h === 0) return;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h, false);
        }
        addEventListener('resize', resize);

        // ===== Анимация =====
        (function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        })();
    </script>
</body>
</html>
