<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>3D-осмотр — OSNW</title>
<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: #202126; overflow: hidden;
        font-family: 'Segoe UI', Arial, sans-serif; color: #fff; height: 100vh; }
    #canvas-container { position: fixed; inset: 0; }
    #cards {
        position: fixed; bottom: 0; left: 0; right: 0;
        display: flex; gap: 8px; overflow-x: auto;
        padding: 10px 12px; z-index: 40;
        background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0));
        -webkit-overflow-scrolling: touch;
    }
    .card {
        flex: 0 0 auto; width: 88px; background: #2D3037;
        border: 2px solid #444; padding: 6px; cursor: pointer;
        text-align: center; transition: border-color 0.15s;
    }
    .card.active { border-color: #FFD700; background: #3a2f00; }
    .card.disabled { opacity: 0.35; cursor: not-allowed; }
    .card img {
        width: 100%; height: 48px; object-fit: contain;
        image-rendering: pixelated; display: block;
        margin-bottom: 4px;
    }
    .card .name { font-size: 10px; color: #fff; line-height: 1.2;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card .quality { font-size: 9px; color: #6a8aff; text-transform: uppercase; }
    #debug {
        position: fixed; top: 12px; left: 12px;
        color: #6a8aff; font-size: 10px; font-family: monospace;
        background: rgba(0,0,0,0.6); padding: 6px 8px; border-radius: 4px;
        pointer-events: none; max-width: 240px; line-height: 1.3;
        white-space: pre-line;
    }
    #loading {
        position: fixed; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        color: #FFD700; font-size: 14px; z-index: 200;
        text-align: center; line-height: 1.6;
    }
</style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="debug"></div>
    <div id="loading">Загрузка...</div>
    <div id="cards"></div>

    <script type="importmap">
    { "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }}
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

        const debugEl = document.getElementById('debug');
        const cardsEl = document.getElementById('cards');
        const loadingEl = document.getElementById('loading');

        const ATLAS_SIZE = 2048;

        // Каталог и атлас будут загружены с сервера
        let CATALOG = [];
        let ATLAS = {};
        let currentId = null;

        const PARTS = ['Object001','Object002','Object003','Object004','Object005',
                       'Object006','Object007','Object008','Object009'];

        // ===== Сцена =====
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x202126);

        const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 1000);
        camera.position.set(0, 0, 4);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.1;
        controls.enablePan = false;

        scene.add(new THREE.AmbientLight(0xffffff, 0.9));
        const d1 = new THREE.DirectionalLight(0xffffff, 0.6); d1.position.set(2, 3, 2); scene.add(d1);
        const d2 = new THREE.DirectionalLight(0xffffff, 0.4); d2.position.set(-2, -1, -2); scene.add(d2);

        // ===== Атлас =====
        const atlasTex = new THREE.TextureLoader().load('Data/3D/WeaponsAtlas.png');
        atlasTex.colorSpace = THREE.SRGBColorSpace;
        atlasTex.flipY = true;
        atlasTex.wrapS = atlasTex.wrapT = THREE.ClampToEdgeWrapping;
        atlasTex.minFilter = THREE.LinearFilter;
        atlasTex.magFilter = THREE.NearestFilter;

        const uniforms = {
            uTiling: { value: new THREE.Vector2(0.0625, 0.0625) },
            uOffset: { value: new THREE.Vector2(0, 0) },
        };

        function makeMaterial() {
            const mat = new THREE.MeshStandardMaterial({
                map: atlasTex, metalness: 0.2, roughness: 0.7, side: THREE.DoubleSide,
            });
            mat.onBeforeCompile = (shader) => {
                shader.uniforms.uTiling = uniforms.uTiling;
                shader.uniforms.uOffset = uniforms.uOffset;
                shader.fragmentShader = shader.fragmentShader
                    .replace('#include <common>', `#include <common>
                        uniform vec2 uTiling;
                        uniform vec2 uOffset;
                    `)
                    .replace('#include <map_fragment>', `
                        vec2 atlasUv = vMapUv * uTiling + uOffset;
                        vec4 sampledDiffuseColor = texture2D( map, atlasUv );
                        diffuseColor *= sampledDiffuseColor;
                    `);
            };
            return mat;
        }

        // ===== Модель =====
        const group = new THREE.Group();
        const loader = new OBJLoader();
        let partsLoaded = 0;

        function loadModel() {
            PARTS.forEach(partName => {
                loader.load('Data/3D/Weapon/AK-47/' + partName + '.obj',
                    (obj) => {
                        obj.traverse(c => { if (c.isMesh && c.geometry) c.material = makeMaterial(); });
                        group.add(obj);
                        partsLoaded++;
                        loadingEl.textContent = `Модель: ${partsLoaded}/${PARTS.length}`;
                        if (partsLoaded === PARTS.length) onModelLoaded();
                    },
                    undefined,
                    () => { partsLoaded++; if (partsLoaded === PARTS.length) onModelLoaded(); }
                );
            });
        }

        function onModelLoaded() {
            const box = new THREE.Box3().setFromObject(group);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            group.position.sub(center);
            group.scale.setScalar(3.0 / maxDim);
            scene.add(group);

            camera.position.set(0, 0, 4);
            controls.target.set(0, 0, 0);
            controls.update();
            resize();

            loadingEl.style.display = 'none';
            buildCards();
        }

        // ===== Применение скина по ID =====
        function applySkinById(id) {
            const s = ATLAS[id];
            if (!s) {
                debugEl.textContent = `Нет координат для ${id}`;
                return;
            }
            currentId = id;

            const tx = s.w / ATLAS_SIZE;
            const ty = s.h / ATLAS_SIZE;
            const ox = s.x / ATLAS_SIZE;
            const oy = 1 - (s.y + s.h) / ATLAS_SIZE;

            uniforms.uTiling.value.set(tx, ty);
            uniforms.uOffset.value.set(ox, oy);

            debugEl.textContent =
                `ID: ${id}\n` +
                `TX: ${tx.toFixed(5)}\n` +
                `TY: ${ty.toFixed(5)}\n` +
                `OX: ${ox.toFixed(5)}\n` +
                `OY: ${oy.toFixed(5)}`;

            buildCards();
        }

        // ===== Карточки =====
        function buildCards() {
            cardsEl.innerHTML = '';
            CATALOG.forEach(item => {
                const has = !!ATLAS[item.id];
                const el = document.createElement('div');
                el.className = 'card' + (item.id === currentId ? ' active' : '') + (has ? '' : ' disabled');
                el.innerHTML = `
                    <img src="${item.image}" alt="${item.name}" onerror="this.style.visibility='hidden'">
                    <div class="name">${item.name}</div>
                    <div class="quality">${item.quality || ''}</div>
                `;
                if (has) {
                    el.addEventListener('click', () => applySkinById(item.id));
                }
                cardsEl.appendChild(el);
            });
        }

        // ===== Загрузка данных =====
        async function loadData() {
            try {
                const [catRes, atlasRes] = await Promise.all([
                    fetch('Data/Catalog/Skins/AK-47.json'),
                    fetch('Data/3D/ak47_atlas.json'),
                ]);
                CATALOG = await catRes.json();
                ATLAS = await atlasRes.json();
            } catch (e) {
                debugEl.textContent = 'Ошибка загрузки JSON: ' + e.message;
                return;
            }
            // первая доступная карточка
            const first = CATALOG.find(i => ATLAS[i.id]);
            if (first) applySkinById(first.id);
            loadModel();
        }

        function resize() {
            const c = document.getElementById('canvas-container');
            const w = c.clientWidth, h = c.clientHeight;
            if (w === 0 || h === 0) return;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h, false);
        }
        addEventListener('resize', resize);

        (function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        })();

        loadData();
    </script>
</body>
</html>
