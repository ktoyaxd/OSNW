<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Atlas Finder — OSNW</title>
<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden;
        background: #202126; color: #fff;
        font-family: 'Segoe UI', Arial, sans-serif; }
    #stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
    #stage canvas { position: absolute; top: 0; left: 0; image-rendering: pixelated; }
    #hud {
        position: fixed; top: 8px; left: 8px; right: 8px;
        display: flex; gap: 6px; flex-wrap: wrap; z-index: 20;
        font-size: 11px; font-family: monospace;
    }
    #hud > * { background: rgba(0,0,0,0.75); padding: 5px 8px;
        border: 1px solid #444; color: #fff; }
    #hud .gold { color: #FFD700; }
    #gridSizes button {
        background: #2D3037; border: 1px solid #444; color: #fff;
        padding: 4px 8px; margin-right: 4px; cursor: pointer;
        font-family: inherit; font-size: 11px;
    }
    #gridSizes button.active { background: #FFD700; color: #202126; }
    #bottom {
        position: fixed; bottom: 0; left: 0; right: 0;
        background: rgba(0,0,0,0.9); padding: 8px 10px 12px;
        z-index: 20; font-size: 12px; font-family: monospace;
        max-height: 45vh; overflow-y: auto;
    }
    #bottom .row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
    #bottom input {
        background: #2D3037; color: #FFD700; border: 1px solid #444;
        padding: 6px 8px; font-family: monospace; font-size: 13px;
        min-width: 0;
    }
    #bottom input.id { flex: 1; }
    #bottom input.coord { width: 64px; }
    #bottom button {
        background: #2D3037; color: #fff; border: 1px solid #444;
        padding: 6px 10px; cursor: pointer; font-family: inherit;
        font-size: 12px;
    }
    #bottom button.gold { background: #FFD700; color: #202126; border-color: #FFD700; }
    #bottom button.red { background: #7a1e1e; border-color: #a33; }
    #list { font-size: 11px; color: #aaa; max-height: 120px; overflow-y: auto;
        white-space: pre; margin-top: 6px; padding: 4px; background: #111;
        border: 1px solid #333; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud">
    <span>Атлас 2048×2048</span>
    <span class="gold" id="pos">—</span>
    <span id="gridSizes">
        размер:
        <button data-size="64">64</button>
        <button data-size="128" class="active">128</button>
        <button data-size="256">256</button>
        <button data-size="512">512</button>
    </span>
</div>

<div id="bottom">
    <div class="row">
        <input class="id" id="idInput" placeholder="ID скина (напр. ak47chan)">
        <input class="coord" id="xIn" placeholder="x">
        <input class="coord" id="yIn" placeholder="y">
        <input class="coord" id="wIn" placeholder="w" value="128">
        <input class="coord" id="hIn" placeholder="h" value="128">
    </div>
    <div class="row">
        <button class="gold" id="addBtn">+ Добавить</button>
        <button id="copyBtn">Скопировать JSON</button>
        <button class="red" id="clearBtn">Очистить</button>
    </div>
    <div id="list">— пусто —</div>
</div>

<script>
// ===== Конфиг =====
const ATLAS_URL = 'Data/3D/WeaponsAtlas.png';
const ATLAS_SIZE = 2048;

// ===== Состояние =====
let gridSize = 128;
let scale = 1;             // масштаб отображения (пиксель атласа → экран)
let offsetX = 0, offsetY = 0;
const stage = document.getElementById('stage');

const atlasCanvas = document.createElement('canvas');
atlasCanvas.width = ATLAS_SIZE;
atlasCanvas.height = ATLAS_SIZE;
const atlasCtx = atlasCanvas.getContext('2d', { willReadFrequently: true });

// Слой для сетки и подсветки — перерисовывается поверх атласа
const overlayCanvas = document.createElement('canvas');
overlayCanvas.width = ATLAS_SIZE;
overlayCanvas.height = ATLAS_SIZE;
const overlayCtx = overlayCanvas.getContext('2d');
stage.appendChild(atlasCanvas);
stage.appendChild(overlayCanvas);

// ===== Загрузка атласа =====
const img = new Image();
img.crossOrigin = 'anonymous';
img.onload = () => {
    atlasCtx.drawImage(img, 0, 0);
    drawOverlay();
    fitToScreen();
};
img.onerror = () => { alert('Не загрузился атлас: ' + ATLAS_URL); };
img.src = ATLAS_URL;

// ===== Вписать атлас в экран =====
function fitToScreen() {
    const w = stage.clientWidth, h = stage.clientHeight;
    const s = Math.min(w / ATLAS_SIZE, h / ATLAS_SIZE);
    scale = s;
    offsetX = (w - ATLAS_SIZE * s) / 2;
    offsetY = (h - ATLAS_SIZE * s) / 2;
    applyTransform();
}
function applyTransform() {
    const t = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
    atlasCanvas.style.transform = t;
    atlasCanvas.style.transformOrigin = '0 0';
    overlayCanvas.style.transform = t;
    overlayCanvas.style.transformOrigin = '0 0';
}

// ===== Отрисовка сетки и выделения =====
let selected = null; // {x, y, w, h}
function drawOverlay() {
    overlayCtx.clearRect(0, 0, ATLAS_SIZE, ATLAS_SIZE);

    // Сетка
    overlayCtx.strokeStyle = 'rgba(255, 215, 0, 0.25)';
    overlayCtx.lineWidth = 1 / scale;
    overlayCtx.beginPath();
    for (let x = 0; x <= ATLAS_SIZE; x += gridSize) {
        overlayCtx.moveTo(x, 0);
        overlayCtx.lineTo(x, ATLAS_SIZE);
    }
    for (let y = 0; y <= ATLAS_SIZE; y += gridSize) {
        overlayCtx.moveTo(0, y);
        overlayCtx.lineTo(ATLAS_SIZE, y);
    }
    overlayCtx.stroke();

    // Выделение
    if (selected) {
        overlayCtx.strokeStyle = '#ff3b3b';
        overlayCtx.lineWidth = 3 / scale;
        overlayCtx.strokeRect(selected.x, selected.y, selected.w, selected.h);
        overlayCtx.fillStyle = 'rgba(255, 60, 60, 0.15)';
        overlayCtx.fillRect(selected.x, selected.y, selected.w, selected.h);
    }
}

// ===== Жесты =====
let pointers = new Map();
let lastDist = 0;
let lastMid = null;

stage.addEventListener('pointerdown', e => {
    stage.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        lastDist = Math.hypot(a.x - b.x, a.y - b.y);
        lastMid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    }
});
stage.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pointers.size === 1) {
        // панорама
        const p = pointers.get(e.pointerId);
        // ничего не делаем — панорама по двум пальцам
    } else if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        const dist = Math.hypot(a.x - b.x, a.y - b.y);
        const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
        const zoom = dist / lastDist;
        const newScale = Math.min(20, Math.max(0.05, scale * zoom));

        // сохранить точку под курсором
        const rect = stage.getBoundingClientRect();
        const mx = mid.x - rect.left, my = mid.y - rect.top;
        const ax = (mx - offsetX) / scale;
        const ay = (my - offsetY) / scale;
        scale = newScale;
        offsetX = mx - ax * scale;
        offsetY = my - ay * scale;

        // панорама
        offsetX += mid.x - lastMid.x;
        offsetY += mid.y - lastMid.y;

        lastDist = dist;
        lastMid = mid;
        applyTransform();
    }
});
function endPointer(e) {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) lastDist = 0;
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);
stage.addEventListener('pointerleave', endPointer);

// Тап — выбираем ячейку
let downAt = null;
stage.addEventListener('pointerdown', e => { downAt = { t: Date.now(), x: e.clientX, y: e.clientY }; });
stage.addEventListener('pointerup', e => {
    if (!downAt) return;
    const dt = Date.now() - downAt.t;
    const dd = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y);
    downAt = null;
    if (dt > 250 || dd > 8) return; // это был жест, не тап
    if (pointers.size > 0) return;

    const rect = stage.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const ax = Math.floor((mx - offsetX) / scale);
    const ay = Math.floor((my - offsetY) / scale);

    if (ax < 0 || ay < 0 || ax >= ATLAS_SIZE || ay >= ATLAS_SIZE) return;

    // привязка к сетке
    const sx = Math.floor(ax / gridSize) * gridSize;
    const sy = Math.floor(ay / gridSize) * gridSize;
    selected = { x: sx, y: sy, w: gridSize, h: gridSize };

    document.getElementById('xIn').value = sx;
    document.getElementById('yIn').value = sy;
    document.getElementById('wIn').value = gridSize;
    document.getElementById('hIn').value = gridSize;
    document.getElementById('pos').textContent = `x=${sx} y=${sy} w=${gridSize} h=${gridSize}`;
    drawOverlay();
});

// ===== Сетка размера =====
document.querySelectorAll('#gridSizes button').forEach(b => {
    b.addEventListener('click', () => {
        document.querySelectorAll('#gridSizes button').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        gridSize = parseInt(b.dataset.size);
        document.getElementById('wIn').value = gridSize;
        document.getElementById('hIn').value = gridSize;
        drawOverlay();
    });
});

// ===== Список найденных =====
const list = {}; // id -> {x,y,w,h}
function renderList() {
    const el = document.getElementById('list');
    const keys = Object.keys(list);
    if (keys.length === 0) { el.textContent = '— пусто —'; return; }
    el.textContent = keys.map(k =>
        `${k}: { "x": ${list[k].x}, "y": ${list[k].y}, "w": ${list[k].w}, "h": ${list[k].h} }`
    ).join('\n');
}

document.getElementById('addBtn').addEventListener('click', () => {
    const id = document.getElementById('idInput').value.trim();
    const x = parseInt(document.getElementById('xIn').value);
    const y = parseInt(document.getElementById('yIn').value);
    const w = parseInt(document.getElementById('wIn').value);
    const h = parseInt(document.getElementById('hIn').value);
    if (!id) { alert('Введи ID'); return; }
    if ([x,y,w,h].some(v => isNaN(v))) { alert('Неверные координаты'); return; }
    list[id] = { x, y, w, h };
    renderList();
    document.getElementById('idInput').value = '';
});

document.getElementById('copyBtn').addEventListener('click', () => {
    const json = JSON.stringify(list, null, 2);
    navigator.clipboard.writeText(json).then(
        () => alert('JSON скопирован в буфер'),
        () => prompt('Скопируй вручную:', json)
    );
});

document.getElementById('clearBtn').addEventListener('click', () => {
    if (!confirm('Очистить список?')) return;
    for (const k in list) delete list[k];
    renderList();
    selected = null;
    drawOverlay();
});

// ===== Ресайз =====
addEventListener('resize', () => {
    fitToScreen();
    drawOverlay();
});

renderList();
</script>
</body>
</html>
