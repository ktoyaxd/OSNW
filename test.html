<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AK-47 Skins — OSNW</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; background: #202126; overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif; color: #fff;
            height: 100vh;
        }
        #canvas-container { position: fixed; inset: 0; }
        .btns {
            position: fixed; bottom: 12px; left: 50%;
            transform: translateX(-50%); display: flex; gap: 8px;
            z-index: 40; flex-wrap: wrap; justify-content: center;
            padding: 0 12px;
        }
        .btn {
            background: #2D3037; color: #fff; border: 2px solid #444;
            padding: 8px 14px; font-size: 12px; font-family: inherit;
            cursor: pointer;
        }
        .btn.active { background: #FFD700; color: #202126; border-color: #FFD700; }
        #debug {
            position: fixed; top: 12px; left: 12px;
            color: #6a8aff; font-size: 10px; font-family: monospace;
            background: rgba(0,0,0,0.6); padding: 6px 8px; border-radius: 4px;
            pointer-events: none; max-width: 240px; line-height: 1.3;
            white-space: pre-line;
        }
        #loading {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #FFD700; font-size: 14px; z-index: 200;
            text-align: center; line-height: 1.6;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="debug"></div>
    <div id="loading">Загрузка...</div>
    <div class="btns" id="btns"></div>

    <script type="importmap">
    { "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }}
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

        const debugEl = document.getElementById('debug');
        const btnsEl = document.getElementById('btns');
        const loadingEl = document.getElementById('loading');

        // ===== Константы =====
        const ATLAS_SIZE = 2048;

        // Глобальный bbox UV модели AK-47 (из отладки)
        const UV_MIN_U = 0.00, UV_MAX_U = 0.74;
        const UV_MIN_V = 0.00, UV_MAX_V = 0.23;
        const UV_RANGE_U = UV_MAX_U - UV_MIN_U;
        const UV_RANGE_V = UV_MAX_V - UV_MIN_V;

        // Скины (x/y — в пикселях атласа, координата y — сверху)
        const SKINS = {
            0: { name: '1-0', x: 300, y: 735, w: 128, h: 128 },
            1: { name: '1-1', x: 300, y: 705, w: 128, h: 128 },
            2: { name: '1-2', x: 300, y: 675, w: 128, h: 128 },
        };
        let currentSkin = 0;

        const PARTS = ['Object001','Object002','Object003','Object004','Object005',
                       'Object006','Object007','Object008','Object009'];

        // ===== Сцена =====
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x202126);

        const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 1000);
        camera.position.set(0, 0, 4);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.1;
        controls.enablePan = false;

        scene.add(new THREE.AmbientLight(0xffffff, 0.9));
        const d1 = new THREE.DirectionalLight(0xffffff, 0.6); d1.position.set(2, 3, 2); scene.add(d1);
        const d2 = new THREE.DirectionalLight(0xffffff, 0.4); d2.position.set(-2, -1, -2); scene.add(d2);

        // ===== Атлас =====
        const atlasTex = new THREE.TextureLoader().load('Data/3D/WeaponsAtlas.png');
        atlasTex.colorSpace = THREE.SRGBColorSpace;
        atlasTex.flipY = true;                       // дефолт Three.js, совпадает с GL UV
        atlasTex.wrapS = atlasTex.wrapT = THREE.ClampToEdgeWrapping;
        atlasTex.minFilter = THREE.LinearFilter;     // без мипмапов — пиксель-арт
        atlasTex.magFilter = THREE.NearestFilter;

        // ===== Общие uniforms для всех мешей =====
        const uniforms = {
            uTiling: { value: new THREE.Vector2(1, 1) },
            uOffset: { value: new THREE.Vector2(0, 0) },
        };

        // ===== Материал с патчем шейдера =====
        function makeMaterial() {
            const mat = new THREE.MeshStandardMaterial({
                map: atlasTex,
                metalness: 0.2,
                roughness: 0.7,
                side: THREE.DoubleSide,
            });
            mat.onBeforeCompile = (shader) => {
                shader.uniforms.uTiling = uniforms.uTiling;
                shader.uniforms.uOffset = uniforms.uOffset;

                shader.fragmentShader = shader.fragmentShader
                    .replace('#include <common>', `#include <common>
                        uniform vec2 uTiling;
                        uniform vec2 uOffset;
                    `)
                    .replace('#include <map_fragment>', `
                        vec2 atlasUv = vMapUv * uTiling + uOffset;
                        vec4 sampledDiffuseColor = texture2D( map, atlasUv );
                        diffuseColor *= sampledDiffuseColor;
                    `);
            };
            return mat;
        }

        // ===== Модель =====
        const BASE = 'Data/3D/Weapon/AK-47/';
        const loader = new OBJLoader();
        const group = new THREE.Group();
        let loaded = 0;

        PARTS.forEach(partName => {
            loader.load(
                BASE + partName + '.obj',
                (obj) => {
                    obj.traverse(child => {
                        if (child.isMesh && child.geometry) {
                            child.material = makeMaterial();
                        }
                    });
                    group.add(obj);
                    loaded++;
                    loadingEl.textContent = `Загрузка модели: ${loaded}/${PARTS.length}`;
                    if (loaded === PARTS.length) onAllLoaded();
                },
                undefined,
                () => {
                    loaded++;
                    if (loaded === PARTS.length) onAllLoaded();
                }
            );
        });

        function onAllLoaded() {
            const box = new THREE.Box3().setFromObject(group);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            group.position.sub(center);
            group.scale.setScalar(3.0 / maxDim);
            scene.add(group);

            camera.position.set(0, 0, 4);
            controls.target.set(0, 0, 0);
            controls.update();

            applySkin(SKINS[currentSkin]);
            buildSkinButtons();
            resize();
            loadingEl.style.display = 'none';

            let dbg = `UV модели: U[${UV_MIN_U}, ${UV_MAX_U}] V[${UV_MIN_V}, ${UV_MAX_V}]\n`;
            dbg += `Спрайт: ${SKINS[currentSkin].name}\n`;
            dbg += `Tiling: ${uniforms.uTiling.value.x.toFixed(4)}, ${uniforms.uTiling.value.y.toFixed(4)}\n`;
            dbg += `Offset: ${uniforms.uOffset.value.x.toFixed(4)}, ${uniforms.uOffset.value.y.toFixed(4)}`;
            debugEl.textContent = dbg;
        }

        // ===== Применение скина =====
        function applySkin(sprite) {
            const su = sprite.w / ATLAS_SIZE;
            const sv = sprite.h / ATLAS_SIZE;

            // Tiling: сжимаем диапазон UV модели до размера спрайта
            const tilingX = su / UV_RANGE_U;
            const tilingY = sv / UV_RANGE_V;

            // Offset: сдвигаем к позиции спрайта
            // V в GL снизу, спрайт в атласе — сверху, поэтому y инвертируем
            const offsetX = sprite.x / ATLAS_SIZE - UV_MIN_U * tilingX;
            const offsetY = (ATLAS_SIZE - sprite.y - sprite.h) / ATLAS_SIZE - UV_MIN_V * tilingY;

            uniforms.uTiling.value.set(tilingX, tilingY);
            uniforms.uOffset.value.set(offsetX, offsetY);
        }

        // ===== Кнопки =====
        function buildSkinButtons() {
            btnsEl.innerHTML = '';
            Object.entries(SKINS).forEach(([idx, skin]) => {
                const btn = document.createElement('button');
                btn.className = 'btn' + (parseInt(idx) === currentSkin ? ' active' : '');
                btn.textContent = skin.name;
                btn.addEventListener('click', () => {
                    currentSkin = parseInt(idx);
                    applySkin(SKINS[currentSkin]);
                    buildSkinButtons();

                    let dbg = `UV модели: U[${UV_MIN_U}, ${UV_MAX_U}] V[${UV_MIN_V}, ${UV_MAX_V}]\n`;
                    dbg += `Спрайт: ${SKINS[currentSkin].name}\n`;
                    dbg += `Tiling: ${uniforms.uTiling.value.x.toFixed(4)}, ${uniforms.uTiling.value.y.toFixed(4)}\n`;
                    dbg += `Offset: ${uniforms.uOffset.value.x.toFixed(4)}, ${uniforms.uOffset.value.y.toFixed(4)}`;
                    debugEl.textContent = dbg;
                });
                btnsEl.appendChild(btn);
            });
        }

        // ===== Ресайз =====
        function resize() {
            const c = document.getElementById('canvas-container');
            const w = c.clientWidth, h = c.clientHeight;
            if (w === 0 || h === 0) return;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h, false);
        }
        addEventListener('resize', resize);

        (function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        })();
    </script>
</body>
</html>
