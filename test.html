<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>UV Debug — OSNW</title>
<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: #202126; overflow: hidden;
        font-family: 'Segoe UI', Arial, sans-serif; color: #fff; height: 100vh; }
    #canvas-container { position: fixed; inset: 0; }
    #panel {
        position: fixed; bottom: 0; left: 0; right: 0;
        background: rgba(0,0,0,0.85); padding: 10px 12px 16px;
        z-index: 40; font-size: 11px; font-family: monospace;
        display: grid; grid-template-columns: 60px 1fr 60px; gap: 4px 8px;
        align-items: center;
    }
    #panel label { color: #6a8aff; }
    #panel input[type=range] { width: 100%; }
    #panel .val { color: #FFD700; text-align: right; }
    #skins { display: flex; gap: 6px; margin-top: 8px; grid-column: 1 / -1; justify-content: center; }
    #skins .btn { background: #2D3037; color: #fff; border: 2px solid #444;
        padding: 6px 12px; font-size: 12px; font-family: inherit; cursor: pointer; }
    #skins .btn.active { background: #FFD700; color: #202126; border-color: #FFD700; }
    #debug { position: fixed; top: 12px; left: 12px; color: #6a8aff;
        font-size: 10px; font-family: monospace; background: rgba(0,0,0,0.6);
        padding: 6px 8px; border-radius: 4px; pointer-events: none;
        max-width: 240px; line-height: 1.3; white-space: pre-line; }
    #loading { position: fixed; top: 50%; left: 50%;
        transform: translate(-50%,-50%); color: #FFD700; font-size: 14px;
        z-index: 200; text-align: center; }
</style>
</head>
<body>
<div id="canvas-container"></div>
<div id="debug"></div>
<div id="loading">Загрузка...</div>
<div id="panel">
    <label>TX</label><input type="range" id="tx" min="0" max="2" step="0.001" value="0.0845"><span class="val" id="txv">0.0845</span>
    <label>TY</label><input type="range" id="ty" min="0" max="2" step="0.001" value="0.2717"><span class="val" id="tyv">0.2717</span>
    <label>OX</label><input type="range" id="ox" min="-1" max="1" step="0.001" value="0.1465"><span class="val" id="oxv">0.1465</span>
    <label>OY</label><input type="range" id="oy" min="-1" max="1" step="0.001" value="0.5786"><span class="val" id="oyv">0.5786</span>
    <div id="skins"></div>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

const debugEl = document.getElementById('debug');
const loadingEl = document.getElementById('loading');

const ATLAS_SIZE = 2048;
const SKINS = {
    0: { name: '1-0', x: 300, y: 735, w: 128, h: 128 },
    1: { name: '1-1', x: 300, y: 705, w: 128, h: 128 },
    2: { name: '1-2', x: 300, y: 675, w: 128, h: 128 },
};
let currentSkin = 0;

const PARTS = ['Object001','Object002','Object003','Object004','Object005',
               'Object006','Object007','Object008','Object009'];

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x202126);
const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 1000);
camera.position.set(0, 0, 4);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
document.getElementById('canvas-container').appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.1; controls.enablePan = false;

scene.add(new THREE.AmbientLight(0xffffff, 0.9));
const d1 = new THREE.DirectionalLight(0xffffff, 0.6); d1.position.set(2,3,2); scene.add(d1);
const d2 = new THREE.DirectionalLight(0xffffff, 0.4); d2.position.set(-2,-1,-2); scene.add(d2);

const atlasTex = new THREE.TextureLoader().load('Data/3D/WeaponsAtlas.png');
atlasTex.colorSpace = THREE.SRGBColorSpace;
atlasTex.flipY = true;
atlasTex.wrapS = atlasTex.wrapT = THREE.ClampToEdgeWrapping;
atlasTex.minFilter = THREE.LinearFilter;
atlasTex.magFilter = THREE.NearestFilter;

const uniforms = {
    uTiling: { value: new THREE.Vector2(0.0845, 0.2717) },
    uOffset: { value: new THREE.Vector2(0.1465, 0.5786) },
};

function makeMaterial() {
    const mat = new THREE.MeshStandardMaterial({
        map: atlasTex, metalness: 0.2, roughness: 0.7, side: THREE.DoubleSide,
    });
    mat.onBeforeCompile = (shader) => {
        shader.uniforms.uTiling = uniforms.uTiling;
        shader.uniforms.uOffset = uniforms.uOffset;
        shader.fragmentShader = shader.fragmentShader
            .replace('#include <common>', `#include <common>
                uniform vec2 uTiling;
                uniform vec2 uOffset;
            `)
            .replace('#include <map_fragment>', `
                vec2 atlasUv = vMapUv * uTiling + uOffset;
                vec4 sampledDiffuseColor = texture2D( map, atlasUv );
                diffuseColor *= sampledDiffuseColor;
            `);
    };
    return mat;
}

const group = new THREE.Group();
const loader = new OBJLoader();
let loaded = 0;

PARTS.forEach(partName => {
    loader.load('Data/3D/Weapon/AK-47/' + partName + '.obj',
        (obj) => {
            obj.traverse(c => { if (c.isMesh && c.geometry) c.material = makeMaterial(); });
            group.add(obj);
            loaded++;
            loadingEl.textContent = `Загрузка: ${loaded}/${PARTS.length}`;
            if (loaded === PARTS.length) onAllLoaded();
        },
        undefined,
        () => { loaded++; if (loaded === PARTS.length) onAllLoaded(); }
    );
});

function onAllLoaded() {
    const box = new THREE.Box3().setFromObject(group);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    group.position.sub(center);
    group.scale.setScalar(3.0 / maxDim);
    scene.add(group);
    controls.target.set(0, 0, 0);
    controls.update();
    loadingEl.style.display = 'none';
    buildSkinButtons();
    resize();
    updateDebug();
}

function updateDebug() {
    debugEl.textContent =
        `Скин: ${SKINS[currentSkin].name}\n` +
        `TX: ${uniforms.uTiling.value.x.toFixed(4)}\n` +
        `TY: ${uniforms.uTiling.value.y.toFixed(4)}\n` +
        `OX: ${uniforms.uOffset.value.x.toFixed(4)}\n` +
        `OY: ${uniforms.uOffset.value.y.toFixed(4)}`;
}

function bindSlider(id, valId, uniformKey, axis) {
    const el = document.getElementById(id);
    const v = document.getElementById(valId);
    el.addEventListener('input', () => {
        const value = parseFloat(el.value);
        v.textContent = value.toFixed(4);
        if (axis === 'x') uniforms[uniformKey].value.x = value;
        else uniforms[uniformKey].value.y = value;
        updateDebug();
    });
}
bindSlider('tx', 'txv', 'uTiling', 'x');
bindSlider('ty', 'tyv', 'uTiling', 'y');
bindSlider('ox', 'oxv', 'uOffset', 'x');
bindSlider('oy', 'oyv', 'uOffset', 'y');

function buildSkinButtons() {
    const el = document.getElementById('skins');
    el.innerHTML = '';
    Object.entries(SKINS).forEach(([idx, s]) => {
        const b = document.createElement('button');
        b.className = 'btn' + (parseInt(idx) === currentSkin ? ' active' : '');
        b.textContent = s.name;
        b.addEventListener('click', () => {
            currentSkin = parseInt(idx);
            // автоустановка offset по спрайту (tiling оставляем как есть)
            const tx = uniforms.uTiling.value.x;
            const ty = uniforms.uTiling.value.y;
            const su = s.w / ATLAS_SIZE, sv = s.h / ATLAS_SIZE;
            // базовый offset такой, чтобы uv=(0,0) попал в нижний-левый угол спрайта
            uniforms.uOffset.value.x = s.x / ATLAS_SIZE - (su / tx - 0) * 0; // пока просто позиция
            uniforms.uOffset.value.y = (ATLAS_SIZE - s.y - s.h) / ATLAS_SIZE;
            // синхронизируем слайдеры
            document.getElementById('ox').value = uniforms.uOffset.value.x;
            document.getElementById('oxv').textContent = uniforms.uOffset.value.x.toFixed(4);
            document.getElementById('oy').value = uniforms.uOffset.value.y;
            document.getElementById('oyv').textContent = uniforms.uOffset.value.y.toFixed(4);
            buildSkinButtons();
            updateDebug();
        });
        el.appendChild(b);
    });
}

function resize() {
    const c = document.getElementById('canvas-container');
    const w = c.clientWidth, h = c.clientHeight;
    if (!w || !h) return;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
}
addEventListener('resize', resize);

(function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
})();
</script>
</body>
</html>
