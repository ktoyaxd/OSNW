<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pixel Bake — OSNW</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; background: #202126; overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif; color: #fff;
            height: 100vh;
        }
        #canvas-container { position: fixed; inset: 0; }
        .btns {
            position: fixed; bottom: 12px; left: 50%;
            transform: translateX(-50%); display: flex; gap: 8px;
            z-index: 40; flex-wrap: wrap; justify-content: center;
            padding: 0 12px;
        }
        .btn {
            background: #2D3037; color: #fff; border: 2px solid #444;
            padding: 8px 14px; font-size: 12px; font-family: inherit;
            cursor: pointer;
        }
        .btn.active { background: #FFD700; color: #202126; border-color: #FFD700; }
        #debug {
            position: fixed; top: 12px; left: 12px;
            color: #6a8aff; font-size: 10px; font-family: monospace;
            background: rgba(0,0,0,0.6); padding: 6px 8px; border-radius: 4px;
            pointer-events: none; max-width: 240px; line-height: 1.3;
            white-space: pre-line;
        }
        #loading {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #FFD700; font-size: 14px; z-index: 200;
            text-align: center; line-height: 1.6;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="debug"></div>
    <div id="loading">Загрузка...</div>
    <div class="btns" id="btns"></div>

    <script type="importmap">
    { "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }}
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

        const debugEl = document.getElementById('debug');
        const btnsEl = document.getElementById('btns');
        const loadingEl = document.getElementById('loading');

        // ===== Константы =====
        const ATLAS_SIZE = 2048;
        const TEX_SIZE = 1024;

        // ГЛОБАЛЬНЫЙ bbox UV модели (общий для всех 9 частей)
        const UV_MIN_U = 0.00, UV_MAX_U = 0.74;
        const UV_MIN_V = 0.00, UV_MAX_V = 0.23;
        const UV_RANGE_U = UV_MAX_U - UV_MIN_U;
        const UV_RANGE_V = UV_MAX_V - UV_MIN_V;

        const SKINS = {
            0: { name: '1-0', x: 300, y: 735, w: 128, h: 128 },
            1: { name: '1-1', x: 300, y: 705, w: 128, h: 128 },
            2: { name: '1-2', x: 300, y: 675, w: 128, h: 128 },
        };
        let currentSkin = 0;

        const PARTS = ['Object001','Object002','Object003','Object004','Object005',
                       'Object006','Object007','Object008','Object009'];

        // ===== Сцена =====
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x202126);

        const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 1000);
        camera.position.set(0, 0, 4);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.1;
        controls.enablePan = false;

        scene.add(new THREE.AmbientLight(0xffffff, 0.9));
        const d1 = new THREE.DirectionalLight(0xffffff, 0.6); d1.position.set(2, 3, 2); scene.add(d1);
        const d2 = new THREE.DirectionalLight(0xffffff, 0.4); d2.position.set(-2, -1, -2); scene.add(d2);

        // ===== Canvas для запекания =====
        const bakeCanvas = document.createElement('canvas');
        bakeCanvas.width = TEX_SIZE;
        bakeCanvas.height = TEX_SIZE;
        const bakeCtx = bakeCanvas.getContext('2d', { willReadFrequently: true });

        const bakedTexture = new THREE.CanvasTexture(bakeCanvas);
        bakedTexture.colorSpace = THREE.SRGBColorSpace;
        bakedTexture.flipY = false;
        bakedTexture.minFilter = THREE.LinearFilter;
        bakedTexture.magFilter = THREE.NearestFilter;
        bakedTexture.needsUpdate = true;

        // ===== Атлас =====
        const atlasImg = new Image();
        atlasImg.crossOrigin = 'anonymous';
        atlasImg.src = 'Data/3D/WeaponsAtlas.png';

        let atlasReady = false;
        atlasImg.onload = () => { atlasReady = true; };
        atlasImg.onerror = () => { debugEl.textContent = 'Ошибка атласа'; };

        // ===== Модель =====
        const BASE = 'Data/3D/Weapon/AK-47/';
        const loader = new OBJLoader();
        const group = new THREE.Group();
        const meshes = [];
        let loaded = 0;

        PARTS.forEach(partName => {
            loader.load(
                BASE + partName + '.obj',
                (obj) => {
                    obj.traverse(child => {
                        if (child.isMesh && child.geometry) {
                            child.material = new THREE.MeshStandardMaterial({
                                map: bakedTexture,
                                metalness: 0.2,
                                roughness: 0.7,
                                side: THREE.DoubleSide,
                            });
                            child.userData.partName = partName;
                            meshes.push(child);
                        }
                    });
                    group.add(obj);
                    loaded++;
                    loadingEl.textContent = `Загрузка модели: ${loaded}/${PARTS.length}`;
                    if (loaded === PARTS.length) onAllLoaded();
                },
                undefined,
                () => {
                    loaded++;
                    if (loaded === PARTS.length) onAllLoaded();
                }
            );
        });

        function onAllLoaded() {
            const box = new THREE.Box3().setFromObject(group);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            group.position.sub(center);
            group.scale.setScalar(3.0 / maxDim);
            scene.add(group);

            camera.position.set(0, 0, 4);
            controls.target.set(0, 0, 0);
            controls.update();

            const waitAtlas = setInterval(() => {
                if (atlasReady) {
                    clearInterval(waitAtlas);
                    bakeAll();
                    loadingEl.style.display = 'none';
                    buildSkinButtons();
                    resize();
                }
            }, 100);
        }

        // ===== Запекание =====
        function bakeAll() {
            const t0 = performance.now();

            bakeCtx.fillStyle = '#202126';
            bakeCtx.fillRect(0, 0, TEX_SIZE, TEX_SIZE);

            const atlasCanvas = document.createElement('canvas');
            atlasCanvas.width = ATLAS_SIZE;
            atlasCanvas.height = ATLAS_SIZE;
            const atlasCtx = atlasCanvas.getContext('2d');
            atlasCtx.drawImage(atlasImg, 0, 0);
            const atlasData = atlasCtx.getImageData(0, 0, ATLAS_SIZE, ATLAS_SIZE).data;

            const outData = bakeCtx.getImageData(0, 0, TEX_SIZE, TEX_SIZE);
            const out = outData.data;

            let totalTri = 0, totalPx = 0;
            meshes.forEach(mesh => {
                const r = bakeMesh(mesh, atlasData, out);
                totalTri += r.triangles;
                totalPx += r.pixels;
            });

            bakeCtx.putImageData(outData, 0, 0);
            bakedTexture.needsUpdate = true;

            const t1 = performance.now();
            debugEl.textContent = `Запечено за ${((t1-t0)/1000).toFixed(2)}с\nТреугольников: ${totalTri}\nПикселей: ${totalPx}\nUV: U[0, 0.74] V[0, 0.23]`;
        }

        function bakeMesh(mesh, atlasData, out) {
            const geom = mesh.geometry;
            const posAttr = geom.attributes.position;
            const uvAttr = geom.attributes.uv;
            const index = geom.index;
            if (!uvAttr) return { triangles: 0, pixels: 0 };

            const sprite = SKINS[currentSkin];
            const sprite_u_off = sprite.x / ATLAS_SIZE;
            const sprite_v_off = (ATLAS_SIZE - sprite.y - sprite.h) / ATLAS_SIZE;
            const sprite_u_size = sprite.w / ATLAS_SIZE;
            const sprite_v_size = sprite.h / ATLAS_SIZE;

            const W = TEX_SIZE, H = TEX_SIZE;
            let pixels = 0;

            const triCount = index ? index.count / 3 : posAttr.count / 3;
            for (let t = 0; t < triCount; t++) {
                let i0, i1, i2;
                if (index) {
                    i0 = index.getX(t*3); i1 = index.getX(t*3+1); i2 = index.getX(t*3+2);
                } else {
                    i0 = t*3; i1 = t*3+1; i2 = t*3+2;
                }

                const u0 = uvAttr.getX(i0), v0 = uvAttr.getY(i0);
                const u1 = uvAttr.getX(i1), v1 = uvAttr.getY(i1);
                const u2 = uvAttr.getX(i2), v2 = uvAttr.getY(i2);

                // НОРМАЛИЗАЦИЯ ПО ГЛОБАЛЬНОМУ bbox (а не по частному)
                const nu0 = (u0 - UV_MIN_U) / UV_RANGE_U, nv0 = (v0 - UV_MIN_V) / UV_RANGE_V;
                const nu1 = (u1 - UV_MIN_U) / UV_RANGE_U, nv1 = (v1 - UV_MIN_V) / UV_RANGE_V;
                const nu2 = (u2 - UV_MIN_U) / UV_RANGE_U, nv2 = (v2 - UV_MIN_V) / UV_RANGE_V;

                // Пишем БЕЗ инверсии Y (flipY=false у текстуры)
                const x0 = nu0 * W, y0 = nv0 * H;
                const x1 = nu1 * W, y1 = nv1 * H;
                const x2 = nu2 * W, y2 = nv2 * H;

                const minX = Math.max(0, Math.floor(Math.min(x0,x1,x2)));
                const maxX = Math.min(W-1, Math.ceil(Math.max(x0,x1,x2)));
                const minY = Math.max(0, Math.floor(Math.min(y0,y1,y2)));
                const maxY = Math.min(H-1, Math.ceil(Math.max(y0,y1,y2)));

                const denom = (y1-y2)*(x0-x2) + (x2-x1)*(y0-y2);
                if (Math.abs(denom) < 1e-6) continue;

                for (let py = minY; py <= maxY; py++) {
                    for (let px = minX; px <= maxX; px++) {
                        const l0 = ((y1-y2)*(px-x2) + (x2-x1)*(py-y2)) / denom;
                        const l1 = ((y2-y0)*(px-x2) + (x0-x2)*(py-y2)) / denom;
                        const l2 = 1 - l0 - l1;
                        if (l0 < 0 || l1 < 0 || l2 < 0) continue;

                        const nU = l0*nu0 + l1*nu1 + l2*nu2;
                        const nV = l0*nv0 + l1*nv1 + l2*nv2;

                        const su = nU * sprite_u_size + sprite_u_off;
                        const sv = nV * sprite_v_size + sprite_v_off;

                        // Инверсия только тут — для сэмплинга атласа (canvas Y вниз)
                        const ax = Math.floor(su * ATLAS_SIZE);
                        const ay = Math.floor((1 - sv) * ATLAS_SIZE);
                        if (ax < 0 || ax >= ATLAS_SIZE || ay < 0 || ay >= ATLAS_SIZE) continue;

                        const ai = (ay * ATLAS_SIZE + ax) * 4;
                        const oi = (py * W + px) * 4;

                        out[oi]   = atlasData[ai];
                        out[oi+1] = atlasData[ai+1];
                        out[oi+2] = atlasData[ai+2];
                        out[oi+3] = 255;
                        pixels++;
                    }
                }
            }
            return { triangles: triCount, pixels };
        }

        function buildSkinButtons() {
            btnsEl.innerHTML = '';
            Object.entries(SKINS).forEach(([idx, skin]) => {
                const btn = document.createElement('button');
                btn.className = 'btn' + (parseInt(idx) === currentSkin ? ' active' : '');
                btn.textContent = skin.name;
                btn.addEventListener('click', () => {
                    currentSkin = parseInt(idx);
                    buildSkinButtons();
                    loadingEl.style.display = 'block';
                    loadingEl.textContent = 'Генерация...';
                    setTimeout(() => {
                        bakeAll();
                        loadingEl.style.display = 'none';
                    }, 30);
                });
                btnsEl.appendChild(btn);
            });
        }

        function resize() {
            const c = document.getElementById('canvas-container');
            const w = c.clientWidth, h = c.clientHeight;
            if (w === 0 || h === 0) return;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h, false);
        }
        addEventListener('resize', resize);

        (function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        })();
    </script>
</body>
</html>
