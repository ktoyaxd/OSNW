<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Test — OSNW</title>
    <style>
        body { margin: 0; background: #202126; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        #loading {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #FFD700; font-size: 16px; z-index: 100;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="loading">Загрузка модели...</div>
    <div id="canvas-container"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

        // Сцена
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x202126);

        // Камера
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 1000);
        camera.position.set(0, 0, 2);

        // Рендерер
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Управление
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.1;
        controls.enablePan = false;

        // Свет
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const d1 = new THREE.DirectionalLight(0xffffff, 0.8);
        d1.position.set(1, 2, 1);
        scene.add(d1);
        const d2 = new THREE.DirectionalLight(0xffffff, 0.4);
        d2.position.set(-1, -1, -1);
        scene.add(d2);

        // Загрузка всех частей
        const PARTS = [
            'Object001.obj', 'Object002.obj', 'Object003.obj',
            'Object004.obj', 'Object005.obj', 'Object006.obj',
            'Object007.obj', 'Object008.obj', 'Object009.obj'
        ];
        const BASE = 'Data/3D/Weapon/AK-47/';
        const loader = new OBJLoader();
        const group = new THREE.Group();
        let loaded = 0;

        PARTS.forEach(filename => {
            loader.load(
                BASE + filename,
                (obj) => {
                    obj.traverse(child => {
                        if (child.isMesh) {
                            child.material = new THREE.MeshStandardMaterial({
                                color: 0xaaaaaa,
                                metalness: 0.3,
                                roughness: 0.6,
                                side: THREE.DoubleSide
                            });
                        }
                    });
                    group.add(obj);
                    loaded++;
                    document.getElementById('loading').textContent = `Загрузка: ${loaded}/${PARTS.length}`;

                    if (loaded === PARTS.length) {
                        document.getElementById('loading').style.display = 'none';

                        // Центрируем всю группу
                        const box = new THREE.Box3().setFromObject(group);
                        const center = box.getCenter(new THREE.Vector3());
                        const size = box.getSize(new THREE.Vector3());
                        const maxDim = Math.max(size.x, size.y, size.z);

                        group.position.sub(center);
                        group.scale.setScalar(2.0 / maxDim);

                        scene.add(group);

                        camera.position.set(0, 0, 2);
                        controls.target.set(0, 0, 0);
                        controls.update();
                    }
                },
                undefined,
                (err) => console.error('Ошибка загрузки', filename, err)
            );
        });

        // Ресайз
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Анимация
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
