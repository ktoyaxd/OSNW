<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Old Strike — Информация</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #202126;
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('Icons/OS_logo.png');
            background-repeat: repeat;
            background-size: 80px 80px;
            background-position: 0 0;
            opacity: 0.06;
            pointer-events: none;
            z-index: 0;
            animation: scrollBg 30s linear infinite;
        }
        @keyframes scrollBg {
            0% { background-position: 0 0; }
            100% { background-position: 300px -300px; }
        }

        .fullscreen-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 40px;
            height: 40px;
            background: #3A3F45;
            border: 1px solid #363940;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
            z-index: 999;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .fullscreen-btn:hover {
            background: #363940;
            border-color: #FFFFFF;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: #3A3F45;
            border: 1px solid #363940;
            padding: 30px;
            margin: 20px auto;
            position: relative;
            z-index: 1;
            animation: fadeIn 0.5s ease;
        }

        .back-btn {
            display: inline-block;
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            padding: 6px 14px;
            border: 1px solid #363940;
            background: #202126;
            margin-bottom: 20px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .back-btn:hover {
            background: #363940;
            border-color: #FFFFFF;
        }

        .info-title {
            font-size: 28px;
            font-weight: 700;
            margin: 10px 0 16px;
        }
        .info-text p {
            color: #FFFFFF;
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 12px;
        }
        .inline-image {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            margin: 12px 0;
            border: 1px solid #363940;
            background: #202126;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 767px) {
            .container { padding: 20px; margin: 10px; }
            .info-title { font-size: 22px; }
            .info-text p { font-size: 15px; }
            .fullscreen-btn { width: 34px; height: 34px; font-size: 16px; top: 10px; right: 10px; }
            .inline-image { max-height: 250px; }
        }
    </style>
</head>
<body>

    <button class="fullscreen-btn" id="fullscreenBtn">⛶</button>

    <div class="container">
        <div class="back-btn" onclick="history.back()">← Назад</div>
        <div id="infoContent">
            <div style="text-align:center;color:#ffffff;padding:40px 0;">Загрузка...</div>
        </div>
    </div>

    <script>
        // ===== ФУНКЦИЯ ДЛЯ ОБРАБОТКИ ТЕКСТА С КАРТИНКАМИ =====
        function formatTextWithImages(text) {
            if (!text) return '';
            
            const lines = text.split('\n');
            let html = '';
            
            for (let line of lines) {
                const trimmed = line.trim();
                // Проверяем, начинается ли строка с "img: "
                if (trimmed.startsWith('img:')) {
                    const imagePath = trimmed.replace('img:', '').trim();
                    html += `<img class="inline-image" src="${imagePath}" alt="Изображение" onerror="this.style.display='none'">`;
                } else if (trimmed === '') {
                    html += `<br>`;
                } else {
                    html += `<p>${trimmed}</p>`;
                }
            }
            
            return html;
        }

        async function loadInfo() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            if (!id) {
                document.getElementById('infoContent').innerHTML = `
                    <div style="text-align:center;color:#ffffff;">ID не указан</div>
                `;
                return;
            }

            try {
                const res = await fetch(`Infoall/${id}.json`);
                if (!res.ok) throw new Error('Информация не найдена');
                const data = await res.json();

                document.getElementById('infoContent').innerHTML = `
                    <div class="info-title">${data.title}</div>
                    <div class="info-text">${formatTextWithImages(data.fullText)}</div>
                `;

                document.title = `${data.title} — Old Strike`;
            } catch (error) {
                document.getElementById('infoContent').innerHTML = `
                    <div style="text-align:center;color:#ffffff;">
                        Информация не найдена<br>
                        <span style="font-size:13px;color:#FFFFFF;">Файл Infoall/${id}.json отсутствует</span>
                    </div>
                `;
            }
        }

        // Полноэкранный режим
        const fsBtn = document.getElementById('fullscreenBtn');
        fsBtn.addEventListener('click', function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });

        loadInfo();
    </script>

</body>
</html>
