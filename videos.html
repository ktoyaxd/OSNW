<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Old Strike Website News — Видео</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #202126;
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background-image: url('Icons/OS_logo.png');
            background-repeat: repeat;
            background-size: 80px 80px;
            opacity: 0.06;
            pointer-events: none;
            z-index: 0;
            animation: scrollDiagonal 30s linear infinite;
        }

        @keyframes scrollDiagonal {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            100% {
                transform: translate(300px, 0px) rotate(0deg);
            }
        }

        .fullscreen-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 40px;
            height: 40px;
            background: #3A3F45;
            border: 1px solid #363940;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
            z-index: 999;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .fullscreen-btn:hover {
            background: #363940;
            border-color: #FFFFFF;
        }

        .container {
            width: 100%;
            max-width: 900px;
            position: relative;
            z-index: 1;
        }

        .top-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .back-btn {
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            padding: 8px 16px;
            border: 1px solid #363940;
            background: #3A3F45;
            transition: background 0.3s;
            cursor: pointer;
            white-space: nowrap;
        }
        .back-btn:hover {
            background: #363940;
            border-color: #FFFFFF;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 10px 16px;
            border: 1px solid #363940;
            background: #3A3F45;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            transition: border 0.3s;
        }
        .search-box:focus {
            border-color: #ffffff;
        }
        .search-box::placeholder {
            color: #ffffff;
            opacity: 0.6;
        }

        .videos-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .video-card {
            background: #3A3F45;
            border: 1px solid #363940;
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: fadeIn 0.5s ease forwards;
            opacity: 0;
            display: flex;
            gap: 16px;
            align-items: center;
        }
        .video-card:hover {
            background: #363940;
            border-color: #FFFFFF;
            transform: translateY(-3px);
        }

        .video-thumb {
            width: 160px;
            min-width: 160px;
            height: 90px;
            object-fit: cover;
            background: #202126;
            border: 1px solid #363940;
        }

        .video-info {
            flex: 1;
            overflow: hidden;
        }
        .video-info .title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .video-info .channel {
            color: #FFFFFF;
            font-size: 14px;
            opacity: 0.8;
        }
        .video-info .date {
            color: #FFFFFF;
            font-size: 12px;
            opacity: 0.6;
            margin-top: 4px;
        }

        .no-videos {
            text-align: center;
            color: #FFFFFF;
            padding: 40px 0;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 767px) {
            .container {
                padding: 0 10px;
            }
            .video-card {
                flex-direction: column;
                align-items: stretch;
                padding: 12px;
            }
            .video-thumb {
                width: 100%;
                height: auto;
                aspect-ratio: 16/9;
            }
            .video-info .title {
                font-size: 16px;
            }
            .fullscreen-btn {
                width: 34px;
                height: 34px;
                font-size: 16px;
                top: 10px;
                right: 10px;
            }
        }

        @media (min-width: 768px) {
            body {
                padding: 40px;
            }
            .videos-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
            }
            .video-card {
                flex-direction: column;
                align-items: stretch;
                padding: 12px;
            }
            .video-thumb {
                width: 100%;
                height: auto;
                aspect-ratio: 16/9;
            }
            .video-info .title {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <button class="fullscreen-btn" id="fullscreenBtn">⛶</button>

    <div class="container">
        <div class="top-bar">
            <a href="index.html" class="back-btn">← Назад</a>
            <input class="search-box" placeholder="Поиск видео..." id="searchInput">
        </div>
        <div class="videos-grid" id="videosGrid">
            <div class="no-videos">Загрузка видео...</div>
        </div>
    </div>

    <script>
        const videosGrid = document.getElementById('videosGrid');
        const searchInput = document.getElementById('searchInput');
        let allVideos = [];

        const BASE_URL = 'https://ktoyaxd.github.io/OSNW';

        async function loadVideosList() {
            try {
                const listRes = await fetch(`${BASE_URL}/Videos/list.json`);
                if (!listRes.ok) throw new Error('Ошибка загрузки list.json');
                allVideos = await listRes.json();

                allVideos.sort((a, b) => {
                    const da = a.date.split('.').reverse().join('');
                    const db = b.date.split('.').reverse().join('');
                    return db.localeCompare(da);
                });

                renderVideos(allVideos);
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                videosGrid.innerHTML = `
                        <div class="no-videos">
                            Не удалось загрузить видео<br>
                            <span style="font-size:13px;color:#FFFFFF;">
                                Ошибка: ${error.message}<br>
                                Проверь папку <b>Videos/</b> и файл <b>list.json</b>
                            </span>
                        </div>
                    `;
            }
        }

        function renderVideos(videoArray) {
            if (!videoArray || videoArray.length === 0) {
                videosGrid.innerHTML = `<div class="no-videos">Видео не найдены</div>`;
                return;
            }

            videosGrid.innerHTML = '';
            videoArray.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.style.animationDelay = `${index * 0.08}s`;

                const thumbUrl = `https://img.youtube.com/vi/${item.id}/mqdefault.jpg`;

                card.innerHTML = `
                        <img class="video-thumb" src="${thumbUrl}" alt="${item.title}" loading="lazy" onerror="this.style.display='none'">
                        <div class="video-info">
                            <div class="title">${item.title}</div>
                            <div class="channel">${item.channel}</div>
                            <div class="date">${item.date}</div>
                        </div>
                    `;

                card.addEventListener('click', () => {
                    window.open(`https://www.youtube.com/watch?v=${item.id}`, '_blank');
                });

                videosGrid.appendChild(card);
            });
        }

        searchInput.addEventListener('input', function() {
            const query = this.value.toLowerCase().trim();
            if (!query) {
                renderVideos(allVideos);
                return;
            }
            const filtered = allVideos.filter(item =>
                item.title.toLowerCase().includes(query) ||
                item.channel.toLowerCase().includes(query)
            );
            renderVideos(filtered);
        });

        // Полноэкранный режим
        const fsBtn = document.getElementById('fullscreenBtn');
        fsBtn.addEventListener('click', function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });

        loadVideosList();
    </script>

</body>
  </html>
