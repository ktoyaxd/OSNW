<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSNW — Информация о всем по игре Old Strike и прочее</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #202126;
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('Icons/OS_logo.png');
            background-repeat: repeat;
            background-size: 80px 80px;
            background-position: 0 0;
            opacity: 0.06;
            pointer-events: none;
            z-index: 0;
            animation: scrollBg 30s linear infinite;
        }
        @keyframes scrollBg {
            0% { background-position: 0 0; }
            100% { background-position: 300px -300px; }
        }

        .fullscreen-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 40px;
            height: 40px;
            background: #3A3F45;
            border: 1px solid #363940;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
            z-index: 999;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .fullscreen-btn:hover {
            background: #363940;
            border-color: #FFFFFF;
        }

        .container {
            width: 100%;
            max-width: 900px;
            position: relative;
            z-index: 1;
        }

        .top-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .back-btn {
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            padding: 8px 16px;
            border: 1px solid #363940;
            background: #3A3F45;
            transition: background 0.3s;
            cursor: pointer;
            white-space: nowrap;
        }
        .back-btn:hover {
            background: #363940;
            border-color: #FFFFFF;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 10px 16px;
            border: 1px solid #363940;
            background: #3A3F45;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            transition: border 0.3s;
        }
        .search-box:focus {
            border-color: #ffffff;
        }
        .search-box::placeholder {
            color: #ffffff;
            opacity: 0.6;
        }

        .info-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .info-card {
            background: #3A3F45;
            border: 1px solid #363940;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: fadeIn 0.5s ease forwards;
            opacity: 0;
        }
        .info-card:hover {
            background: #363940;
            border-color: #FFFFFF;
            transform: translateY(-3px);
        }
        .info-card .title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .info-card .preview {
            color: #ffffff;
            font-size: 14px;
            line-height: 1.5;
        }
        .info-card .image-preview {
            width: 100%;
            max-height: 150px;
            object-fit: cover;
            margin-bottom: 10px;
            background: #202126;
            border: 1px solid #363940;
        }
        .no-info {
            text-align: center;
            color: #FFFFFF;
            padding: 40px 0;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (min-width: 768px) {
            body {
                padding: 40px;
            }
            .info-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
            }
            .info-card .title {
                font-size: 18px;
            }
        }

        @media (max-width: 767px) {
            .container {
                padding: 0 10px;
            }
            .fullscreen-btn {
                width: 34px;
                height: 34px;
                font-size: 16px;
                top: 10px;
                right: 10px;
            }
        }
    </style>
</head>
<body>

    <button class="fullscreen-btn" id="fullscreenBtn">⛶</button>

    <div class="container">
        <div class="top-bar">
            <a href="index.html" class="back-btn">← Назад</a>
            <input class="search-box" placeholder="Поиск информации..." id="searchInput">
        </div>
        <div class="info-grid" id="infoGrid">
            <div class="no-info">Загрузка...</div>
        </div>
    </div>

    <script>
        const infoGrid = document.getElementById('infoGrid');
        const searchInput = document.getElementById('searchInput');
        let allInfo = [];

        const BASE_URL = 'https://ktoyaxd.github.io/OSNW';

        async function loadInfoList() {
            try {
                const listRes = await fetch(`${BASE_URL}/Infoall/list.json`);
                if (!listRes.ok) throw new Error('Ошибка загрузки list.json');
                const files = await listRes.json();

                const infoPromises = files.map(async (file) => {
                    const res = await fetch(`${BASE_URL}/Infoall/${file}`);
                    if (!res.ok) throw new Error(`Ошибка загрузки ${file}`);
                    return await res.json();
                });

                allInfo = await Promise.all(infoPromises);
                renderInfo(allInfo);
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                infoGrid.innerHTML = `
                    <div class="no-info">
                        Не удалось загрузить информацию<br>
                        <span style="font-size:13px;color:#FFFFFF;">
                            Ошибка: ${error.message}<br>
                            Проверь папку <b>Infoall/</b> и файл <b>list.json</b>
                        </span>
                    </div>
                `;
            }
        }

        function renderInfo(infoArray) {
            if (!infoArray || infoArray.length === 0) {
                infoGrid.innerHTML = `<div class="no-info">Информация не найдена</div>`;
                return;
            }

            infoGrid.innerHTML = '';
            infoArray.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'info-card';
                card.style.animationDelay = `${index * 0.08}s`;

                let imageHtml = '';
                if (item.image) {
                    imageHtml = `<img class="image-preview" src="${item.image}" alt="${item.title}" onerror="this.style.display='none'">`;
                }

                card.innerHTML = `
                    ${imageHtml}
                    <div class="title">${item.title}</div>
                    <div class="preview">${item.preview}</div>
                `;

                card.addEventListener('click', () => {
                    const fileName = item._fileName || `info_${index}`;
                    window.location.href = `info_article.html?id=${fileName}`;
                });

                infoGrid.appendChild(card);
            });
        }

        searchInput.addEventListener('input', function() {
            const query = this.value.toLowerCase().trim();
            if (!query) {
                renderInfo(allInfo);
                return;
            }
            const filtered = allInfo.filter(item =>
                item.title.toLowerCase().includes(query) ||
                item.preview.toLowerCase().includes(query)
            );
            renderInfo(filtered);
        });

        const fsBtn = document.getElementById('fullscreenBtn');
        fsBtn.addEventListener('click', function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });

        loadInfoList();
    </script>

</body>
</html>
