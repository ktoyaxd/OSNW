<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Old Strike News Website</title>
    <style>
        /* ===== ОБЩИЕ СТИЛИ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #202126;
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background-image: url('Icons/OS_logo.png');
            background-repeat: repeat;
            background-size: 80px 80px;
            opacity: 0.06;
            pointer-events: none;
            z-index: 0;
            animation: scrollDiagonal 30s linear infinite;
        }
        @keyframes scrollDiagonal {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(300px, -150px) rotate(0deg); }
        }

        .sort-toggle {
            padding: 9px 17px;
            background: #3A3F45;
            border: 1px solid #363940;
            color: #ffffff;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            min-width: 140px;
            text-align: left;
        }
        .sort-toggle:hover {
            background: #363940;
            border-color: #FFFFFF;
        }
        .sort-menu {
            background: #3A3F45;
            border: 1px solid #363940;
            border-top: none;
            min-width: 150px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .sort-option {
            display: block;
            width: 100%;
            padding: 8px 17px;
            background: transparent;
            border: none;
            border-bottom: 1px solid #2a2f3a;
            color: #ffffff;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
            transition: background 0.2s;
        }
        .sort-option:last-child {
            border-bottom: none;
        }
        .sort-option:hover {
            background: #2a303a;
        }
        .sort-option.active {
            background: #2a303a;
            color: #6a8aff;
        }
        .sort-dropdown {
            position: relative;
            display: inline-block;
        }
        .shuffle-btn {
            display: none;
            padding: 8px 14px;
            background: #3A3F45;
            border: 1px solid #363940;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
            margin-left: 8px;
        }
        .shuffle-btn:hover {
            background: #363940;
            border-color: #FFFFFF;
        }

        .infosite-btn {
            position: fixed;
            top: 60px;
            right: 16px;
            width: 40px;
            height: 40px;
            background: #3A3F45;
            border: 1px solid #363940;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
            z-index: 999;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .infosite-btn:hover {
            background: #363940;
            border-color: #FFFFFF;
        }

        .fullscreen-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 40px;
            height: 40px;
            background: #3A3F45;
            border: 1px solid #363940;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
            z-index: 999;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .fullscreen-btn:hover {
            background: #363940;
            border-color: #FFFFFF;
        }

        .container {
            width: 100%;
            max-width: 900px;
            position: relative;
            z-index: 1;
        }

        /* ===== МЕНЮ ===== */
        .menu-container {
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }
        .logo {
            margin-bottom: 40px;
        }
        .logo img {
            width: 250px;
            height: auto;
        }
        .main-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }
        .menu-btn {
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 0 auto 16px;
            padding: 16px;
            background: #3A3F45;
            border: 1px solid #363940;
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .menu-btn:hover {
            background: #363940;
            border-color: #FFFFFF;
            transform: translateY(-2px);
        }
        .menu-btn.sub {
            max-width: 200px;
            font-size: 15px;
            padding: 14px;
            margin-top: 4px;
            text-decoration: none;
            color: #fff;
        }
        .menu-btn.hidden {
            display: none;
        }
        .sub-menu {
            display: none;
            margin-top: 10px;
        }
        .sub-menu.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== СТРАНИЦЫ ===== */
        .page {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .page.active {
            display: block;
        }

        .top-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: nowrap;
        }
        .back-btn {
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            padding: 8px 16px;
            border: 1px solid #363940;
            background: #3A3F45;
            transition: background 0.3s;
            cursor: pointer;
            white-space: nowrap;
        }
        .back-btn:hover {
            background: #363940;
            border-color: #FFFFFF;
        }
        .search-box {
            flex: 1;
            min-width: 100px;
            padding: 10px 16px;
            border: 1px solid #363940;
            background: #3A3F45;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            transition: border 0.3s;
        }
        .search-box:focus {
            border-color: #ffffff;
        }
        .search-box::placeholder {
            color: #ffffff;
            opacity: 0.6;
        }

        .sort-dropdown {
            flex-shrink: 0;
        }

        /* ===== СЕТКА ===== */
        .grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .card {
            background: #3A3F45;
            border: 1px solid #363940;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: fadeIn 0.5s ease forwards;
            opacity: 0;
        }
        .card:hover {
            background: #363940;
            border-color: #FFFFFF;
            transform: translateY(-3px);
        }
        .card .date {
            color: #FFFFFF;
            font-size: 13px;
            font-weight: 600;
            opacity: 0.7;
        }
        .card .title {
            font-size: 20px;
            font-weight: 700;
            margin: 8px 0 6px;
        }
        .card .preview {
            color: #ffffff;
            font-size: 14px;
            line-height: 1.5;
        }
        .card .author {
            color: #FFFFFF;
            font-size: 12px;
            margin-top: 12px;
            opacity: 0.7;
        }
        .card .thumb {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            margin-bottom: 10px;
            border: 1px solid #363940;
            background: #202126;
        }
        .no-data {
            text-align: center;
            color: #FFFFFF;
            padding: 40px 0;
        }

        /* ===== ПАГИНАЦИЯ ===== */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-top: 20px;
            margin-bottom: 30px;
        }
        .page-btn {
            padding: 8px 16px;
            background: #3A3F45;
            border: 1px solid #363940;
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
        }
        .page-btn:hover:not(:disabled) {
            background: #363940;
            border-color: #FFFFFF;
        }
        .page-btn:disabled {
            opacity: 0.3;
            cursor: default;
        }
        .page-info {
            color: #fff;
            font-size: 14px;
        }

        /* ===== СТАТЬИ ===== */
        .article-container {
            background: #3A3F45;
            border: 1px solid #363940;
            padding: 30px;
            animation: fadeIn 0.5s ease;
        }
        .article-title {
            font-size: 28px;
            font-weight: 700;
            margin: 10px 0 16px;
        }
        .article-author {
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 20px;
            opacity: 0.7;
        }
        .article-date {
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            opacity: 0.7;
        }
        .article-text p {
            color: #FFFFFF;
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 12px;
        }
        .inline-image {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            margin: 12px 0;
            border: 1px solid #363940;
            background: #202126;
        }

        /* ===== ЧАТ ===== */
        .chat-inputs {
            display: flex;
            gap: 10px;
            width: 100%;
            flex-wrap: wrap;
        }
        .chat-inputs input {
            flex: 1;
            min-width: 80px;
            padding: 10px;
            border: 1px solid #363940;
            background: #3A3F45;
            color: #fff;
            outline: none;
        }
        .chat-inputs input:focus {
            border-color: #fff;
        }
        .chat-inputs button {
            padding: 10px 20px;
            background: #3A3F45;
            border: 1px solid #363940;
            color: #fff;
            cursor: pointer;
            flex-shrink: 0;
            transition: 0.3s;
        }
        .chat-inputs button:hover {
            background: #363940;
            border-color: #FFFFFF;
        }
        .load-more-btn {
            display: none;
            margin-top: 10px;
            padding: 8px 16px;
            background: #3A3F45;
            border: 1px solid #363940;
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
        }
        .load-more-btn:hover {
            background: #363940;
            border-color: #FFFFFF;
        }

        /* ===== АДАПТИВ ===== */
        @media (min-width: 768px) {
            body { padding: 40px; }
            .grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
            }
            .card .title { font-size: 18px; }
        }
        @media (max-width: 767px) {
            .container { padding: 0 10px; }
            .fullscreen-btn {
                width: 34px;
                height: 34px;
                font-size: 16px;
                top: 10px;
                right: 10px;
            }
            .logo img { width: 200px; }
            .main-title { font-size: 22px; }
            .menu-btn { font-size: 16px; padding: 14px; }
            .article-title { font-size: 22px; }
            .article-text p { font-size: 15px; }
            .inline-image { max-height: 250px; }
            .article-container { padding: 20px; }
            .top-bar { flex-wrap: wrap; }
            .search-box { min-width: 80px; flex: 1 1 100%; }
            .sort-dropdown { margin-left: auto; }
        }
    </style>
</head>
<body>

    <button class="fullscreen-btn" id="fullscreenBtn">⛶</button>

    <div class="container">

        <!-- ===== ИНФО О САЙТЕ ===== -->
        <div id="page-infosite" class="page">
            <div class="top-bar">
                <div class="back-btn" data-back="back">Назад</div>
            </div>
            <div class="article-container" id="infoSiteContent">
                <div style="text-align:center;color:#ffffff;padding:40px 0;">Загрузка...</div>
            </div>
        </div>

        <!-- ===== ЧАТ ===== -->
        <div id="page-chat" class="page">
            <div class="top-bar">
                <div class="back-btn" data-back="back">Назад</div>
            </div>
            <div class="article-container" style="padding:15px; width:100%; box-sizing:border-box;">
                <div id="chatBox" style="height:400px; overflow-y:auto; margin-bottom:12px; background:#202126; padding:12px; border:1px solid #363940; width:100%;"></div>
                <div class="chat-inputs">
                    <input type="text" id="chatUsername" placeholder="Ваше имя">
                    <input type="text" id="chatMessage" placeholder="Сообщение...">
                    <button id="chatSendBtn">Отправить</button>
                </div>
                <button class="load-more-btn" id="loadMoreBtn">Смотреть дальше</button>
            </div>
        </div>

        <!-- ===== ГЛАВНОЕ МЕНЮ ===== -->
        <div id="page-menu" class="page active">
            <div class="menu-container">
                <div class="logo">
                    <img src="Icons/logo.png" alt="Old Strike News Website">
                </div>
                <button class="infosite-btn" id="InfoSite">i</button>
                <div class="menu-btn" id="readBtn">Читать</div>
                <div class="sub-menu" id="subMenu">
                    <div class="menu-btn sub" data-page="infoall">Информация о всём по игре и прочее</div>
                    <div class="menu-btn sub" data-page="news">Новости</div>
                    <div class="menu-btn sub" data-page="videos">Видео</div>
                    <div class="menu-btn sub" data-page="chat">Чат (ТЕСТ)</div>
                </div>
            </div>
        </div>

        <!-- ===== НОВОСТИ ===== -->
        <div id="page-news" class="page">
            <div class="top-bar">
                <div class="back-btn" data-back="back">Назад</div>
                <input class="search-box" placeholder="Поиск новостей..." id="newsSearch">
            </div>
            <div class="grid" id="newsGrid"><div class="no-data">Загрузка новостей...</div></div>
            <div class="pagination" id="newsPagination">
                <button class="page-btn" data-page="prev" id="newsPrev">◀</button>
                <span class="page-info" id="newsPageInfo">1 / 1</span>
                <button class="page-btn" data-page="next" id="newsNext">▶</button>
            </div>
        </div>

        <!-- ===== ВИДЕО ===== -->
        <div id="page-videos" class="page">
            <div class="top-bar">
                <div class="back-btn" data-back="back">Назад</div>
                <input class="search-box" placeholder="Поиск видео..." id="videoSearch">
                <div class="sort-dropdown">
                    <button class="sort-toggle" id="sortToggle">Свежие ▼</button>
                    <div class="sort-menu" id="sortMenu">
                        <button class="sort-option" data-sort="newest">Свежие</button>
                        <button class="sort-option" data-sort="random">Рандом</button>
                        <button class="sort-option" data-sort="oldest">Старые</button>
                    </div>
                    <button class="shuffle-btn" id="shuffleBtn">🔄 Перемешать</button>
                </div>
            </div>
            <div class="grid" id="videoGrid"><div class="no-data">Загрузка видео...</div></div>
            <div class="pagination" id="videoPagination">
                <button class="page-btn" data-page="prev" id="videoPrev">◀</button>
                <span class="page-info" id="videoPageInfo">1 / 1</span>
                <button class="page-btn" data-page="next" id="videoNext">▶</button>
            </div>
        </div>

        <!-- ===== ИНФОРМАЦИЯ ===== -->
        <div id="page-infoall" class="page">
            <div class="top-bar">
                <div class="back-btn" data-back="back">Назад</div>
                <input class="search-box" placeholder="Поиск информации..." id="infoSearch">
            </div>
            <div class="grid" id="infoGrid"><div class="no-data">Загрузка...</div></div>
            <div class="pagination" id="infoPagination">
                <button class="page-btn" data-page="prev" id="infoPrev">◀</button>
                <span class="page-info" id="infoPageInfo">1 / 1</span>
                <button class="page-btn" data-page="next" id="infoNext">▶</button>
            </div>
        </div>

        <!-- ===== СТАТЬЯ НОВОСТИ ===== -->
        <div id="page-article" class="page">
            <div class="top-bar">
                <div class="back-btn" data-back="back">Назад</div>
            </div>
            <div class="article-container" id="articleContent">
                <div style="text-align:center;color:#ffffff;padding:40px 0;">Загрузка статьи...</div>
            </div>
        </div>

        <!-- ===== СТАТЬЯ ИНФОРМАЦИИ ===== -->
        <div id="page-info-article" class="page">
            <div class="top-bar">
                <div class="back-btn" data-back="back">Назад</div>
            </div>
            <div class="article-container" id="infoArticleContent">
                <div style="text-align:center;color:#ffffff;padding:40px 0;">Загрузка...</div>
            </div>
        </div>

    </div>
<script>
    // ===== ОБЩИЕ ПЕРЕМЕННЫЕ =====
    const BASE_URL = 'https://osnw.duckdns.org/';

    // ===== ПАГИНАЦИЯ =====
    const PER_PAGE = 6;
    let newsPage = 1;
    let videosPage = 1;
    let infoPage = 1;

    // ===== ИСТОРИЯ СТРАНИЦ ДЛЯ КНОПКИ "НАЗАД" =====
    let pageHistory = ['menu'];

    // ===== НАВИГАЦИЯ =====
    function showPage(id, addHistory = true) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        const target = document.getElementById('page-' + id);
        if (target) target.classList.add('active');
        if (addHistory && id !== 'menu') {
            pageHistory.push(id);
        }
    }

    // ===== КНОПКИ "НАЗАД" =====
    document.querySelectorAll('[data-back]').forEach(btn => {
        btn.addEventListener('click', function() {
            if (pageHistory.length > 1) {
                pageHistory.pop();
                const prev = pageHistory[pageHistory.length - 1];
                showPage(prev, false);
            } else {
                showPage('menu', false);
            }
        });
    });

    // ===== КНОПКИ ПОДМЕНЮ =====
    document.querySelectorAll('[data-page]').forEach(btn => {
        btn.addEventListener('click', function() {
            const page = this.dataset.page;
            showPage(page);
            if (page === 'news' && !window.newsLoaded) loadNews();
            if (page === 'videos' && !window.videosLoaded) loadVideos();
            if (page === 'infoall' && !window.infoLoaded) loadInfoAll();
        });
    });

    document.getElementById('readBtn').addEventListener('click', function() {
        this.classList.add('hidden');
        document.getElementById('subMenu').classList.add('show');
    });

    // ===== ФУНКЦИИ ДЛЯ ТЕКСТА =====
    function formatDateFromId(id) {
        if (!id || id.length < 12) return id;
        return id.slice(0, 2) + '.' + id.slice(2, 4) + '.' + id.slice(4, 8) + ' ' + id.slice(8, 10) + ':' + id.slice(10, 12);
    }

    function formatTextWithImages(text) {
        if (!text) return '';
        const lines = text.split('\n');
        let html = '';
        for (let line of lines) {
            const trimmed = line.trim();
            if (trimmed.startsWith('img:')) {
                const imagePath = trimmed.replace('img:', '').trim();
                html += `<img class="inline-image" src="${imagePath}" alt="Изображение" onerror="this.style.display='none'">`;
            } else if (trimmed === '') {
                html += '<br>';
            } else {
                html += `<p>${trimmed}</p>`;
            }
        }
        return html;
    }

    // ===== НОВОСТИ =====
    async function loadNews() {
        window.newsLoaded = true;
        try {
            const listRes = await fetch(`${BASE_URL}/News/list.json`);
            if (!listRes.ok) throw new Error('Ошибка загрузки list.json');
            const files = await listRes.json();

            const newsPromises = files.map(async (id) => {
                const res = await fetch(`${BASE_URL}/News/${id}.json`);
                if (!res.ok) throw new Error(`Ошибка загрузки ${id}`);
                const data = await res.json();
                data._id = id;
                data._date = formatDateFromId(id);
                return data;
            });

            window.allNews = await Promise.all(newsPromises);
            window.allNews.sort((a, b) => b._id.localeCompare(a._id));
            window._filteredNews = window.allNews;
            newsPage = 1;
            renderNewsWithPagination();
        } catch (error) {
            document.getElementById('newsGrid').innerHTML = `
                <div class="no-data">Не удалось загрузить новости<br><span style="font-size:13px;">Ошибка: ${error.message}</span></div>
            `;
            document.getElementById('newsPagination').style.display = 'none';
        }
    }

    function renderNewsWithPagination() {
        const data = window._filteredNews || [];
        const start = (newsPage - 1) * PER_PAGE;
        const end = start + PER_PAGE;
        const pageItems = data.slice(start, end);
        renderNews(pageItems);
        updatePagination(data.length, 'news');
    }

    function renderNews(newsArray) {
        const grid = document.getElementById('newsGrid');
        if (!newsArray || newsArray.length === 0) {
            grid.innerHTML = `<div class="no-data">Новостей не найдено</div>`;
            return;
        }
        grid.innerHTML = '';
        newsArray.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.style.animationDelay = `${index * 0.08}s`;
            card.innerHTML = `
                <div class="date">${item._date}</div>
                <div class="title">${item.title}</div>
                <div class="preview">${item.preview || ''}</div>
                <div class="author">${item.author || 'Автор не указан'}</div>
            `;
            card.addEventListener('click', () => {
                window.currentArticleId = item._id;
                showPage('article');
                loadArticle(item._id);
            });
            grid.appendChild(card);
        });
    }

    document.getElementById('newsSearch').addEventListener('input', function() {
        const query = this.value.toLowerCase().trim();
        if (!window.allNews) return;
        if (!query) {
            window._filteredNews = window.allNews;
        } else {
            window._filteredNews = window.allNews.filter(item =>
                item.title.toLowerCase().includes(query) ||
                (item.preview || '').toLowerCase().includes(query) ||
                (item.author || '').toLowerCase().includes(query)
            );
        }
        newsPage = 1;
        renderNewsWithPagination();
    });

    document.getElementById('newsPrev').addEventListener('click', function() {
        if (newsPage > 1) { newsPage--; renderNewsWithPagination(); }
    });
    document.getElementById('newsNext').addEventListener('click', function() {
        const total = (window._filteredNews || []).length;
        if (newsPage < Math.ceil(total / PER_PAGE)) { newsPage++; renderNewsWithPagination(); }
    });

    // ===== ВИДЕО =====
    let currentSort = 'newest';

    async function loadVideos() {
        window.videosLoaded = true;
        try {
            const listRes = await fetch(`${BASE_URL}/Videos/list.json`);
            if (!listRes.ok) throw new Error('Ошибка загрузки list.json');
            window.allVideos = await listRes.json();
            window._filteredVideos = window.allVideos;
            videosPage = 1;
            renderVideosWithPagination();
        } catch (error) {
            document.getElementById('videoGrid').innerHTML = `
                <div class="no-data">Не удалось загрузить видео<br><span style="font-size:13px;">Ошибка: ${error.message}</span></div>
            `;
            document.getElementById('videoPagination').style.display = 'none';
        }
    }

    function renderVideosWithPagination() {
        const data = window._filteredVideos || [];
        const start = (videosPage - 1) * PER_PAGE;
        const end = start + PER_PAGE;
        const pageItems = data.slice(start, end);
        renderVideos(pageItems);
        updatePagination(data.length, 'video');
    }

    function renderVideos(videoArray) {
        const grid = document.getElementById('videoGrid');
        if (!videoArray || videoArray.length === 0) {
            grid.innerHTML = `<div class="no-data">Видео не найдены</div>`;
            return;
        }
        grid.innerHTML = '';
        videoArray.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.style.animationDelay = `${index * 0.08}s`;
            const thumbUrl = `https://img.youtube.com/vi/${item.id}/mqdefault.jpg`;
            card.innerHTML = `
                <img class="thumb" src="${thumbUrl}" alt="${item.title}" loading="lazy" onerror="this.style.display='none'">
                <div class="title">${item.title}</div>
                <div class="preview">${item.channel || ''}</div>
                <div class="author">${item.date || ''}</div>
            `;
            card.addEventListener('click', () => {
                window.open(`https://www.youtube.com/watch?v=${item.id}`, '_blank');
            });
            grid.appendChild(card);
        });
    }

    document.getElementById('videoSearch').addEventListener('input', function() {
        const query = this.value.toLowerCase().trim();
        if (!window.allVideos) return;
        if (!query) {
            window._filteredVideos = window.allVideos;
        } else {
            window._filteredVideos = window.allVideos.filter(item =>
                item.title.toLowerCase().includes(query) ||
                (item.channel || '').toLowerCase().includes(query)
            );
        }
        videosPage = 1;
        renderVideosWithPagination();
    });

    document.getElementById('videoPrev').addEventListener('click', function() {
        if (videosPage > 1) { videosPage--; renderVideosWithPagination(); }
    });
    document.getElementById('videoNext').addEventListener('click', function() {
        const total = (window._filteredVideos || []).length;
        if (videosPage < Math.ceil(total / PER_PAGE)) { videosPage++; renderVideosWithPagination(); }
    });

    // ===== СОРТИРОВКА ВИДЕО =====
    const sortToggle = document.getElementById('sortToggle');
    const sortMenu = document.getElementById('sortMenu');
    const shuffleBtn = document.getElementById('shuffleBtn');

    sortToggle.addEventListener('click', function(e) {
        e.stopPropagation();
        sortMenu.style.display = sortMenu.style.display === 'block' ? 'none' : 'block';
    });

    document.addEventListener('click', function() {
        sortMenu.style.display = 'none';
    });

    document.querySelectorAll('.sort-option').forEach(btn => {
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const sortType = this.dataset.sort;
            currentSort = sortType;
            const labels = { 'newest': 'Свежие', 'random': 'Рандом', 'oldest': 'Старые' };
            sortToggle.textContent = labels[sortType] + ' ▼';
            document.querySelectorAll('.sort-option').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            sortMenu.style.display = 'none';

            if (sortType === 'random') {
                shuffleBtn.style.display = 'inline-block';
            } else {
                shuffleBtn.style.display = 'none';
            }

            if (window.allVideos) {
                window._filteredVideos = sortVideos(window.allVideos, sortType);
                videosPage = 1;
                renderVideosWithPagination();
            }
        });
    });

    shuffleBtn.addEventListener('click', function() {
        if (window.allVideos) {
            window._filteredVideos = sortVideos(window.allVideos, 'random');
            videosPage = 1;
            renderVideosWithPagination();
        }
    });

    function sortVideos(videos, sortType) {
        const sorted = [...videos];
        switch(sortType) {
            case 'newest':
                return sorted.sort((a, b) => {
                    const da = a.date.split('.').reverse().join('');
                    const db = b.date.split('.').reverse().join('');
                    return db.localeCompare(da);
                });
            case 'oldest':
                return sorted.sort((a, b) => {
                    const da = a.date.split('.').reverse().join('');
                    const db = b.date.split('.').reverse().join('');
                    return da.localeCompare(db);
                });
            case 'random':
                return sorted.sort(() => Math.random() - 0.5);
            default:
                return sorted;
        }
    }

    // ===== ИНФОРМАЦИЯ =====
    async function loadInfoAll() {
        window.infoLoaded = true;
        try {
            const listRes = await fetch(`${BASE_URL}/Infoall/list.json`);
            if (!listRes.ok) throw new Error('Ошибка загрузки list.json');
            const files = await listRes.json();

            const infoPromises = files.map(async (file) => {
                const res = await fetch(`${BASE_URL}/Infoall/${file}`);
                if (!res.ok) throw new Error(`Ошибка загрузки ${file}`);
                const data = await res.json();
                data._fileName = file.replace('.json', '');
                return data;
            });

            window.allInfo = await Promise.all(infoPromises);
            window._filteredInfo = window.allInfo;
            infoPage = 1;
            renderInfoWithPagination();
        } catch (error) {
            document.getElementById('infoGrid').innerHTML = `
                <div class="no-info">Не удалось загрузить информацию<br><span style="font-size:13px;">Ошибка: ${error.message}</span></div>
            `;
            document.getElementById('infoPagination').style.display = 'none';
        }
    }

    function renderInfoWithPagination() {
        const data = window._filteredInfo || [];
        const start = (infoPage - 1) * PER_PAGE;
        const end = start + PER_PAGE;
        const pageItems = data.slice(start, end);
        renderInfo(pageItems);
        updatePagination(data.length, 'info');
    }

    function renderInfo(infoArray) {
        const grid = document.getElementById('infoGrid');
        if (!infoArray || infoArray.length === 0) {
            grid.innerHTML = `<div class="no-data">Информация не найдена</div>`;
            return;
        }
        grid.innerHTML = '';
        infoArray.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.style.animationDelay = `${index * 0.08}s`;

            let imageHtml = '';
            if (item.image) {
                imageHtml = `<img class="thumb" src="${item.image}" alt="${item.title}" onerror="this.style.display='none'">`;
            }

            card.innerHTML = `
                ${imageHtml}
                <div class="title">${item.title}</div>
                <div class="preview">${item.preview || ''}</div>
            `;
            card.addEventListener('click', () => {
                window.currentInfoId = item._fileName || `info_${index}`;
                showPage('info-article');
                loadInfoArticle(window.currentInfoId);
            });
            grid.appendChild(card);
        });
    }

    document.getElementById('infoSearch').addEventListener('input', function() {
        const query = this.value.toLowerCase().trim();
        if (!window.allInfo) return;
        if (!query) {
            window._filteredInfo = window.allInfo;
        } else {
            window._filteredInfo = window.allInfo.filter(item =>
                item.title.toLowerCase().includes(query) ||
                (item.preview || '').toLowerCase().includes(query)
            );
        }
        infoPage = 1;
        renderInfoWithPagination();
    });

    document.getElementById('infoPrev').addEventListener('click', function() {
        if (infoPage > 1) { infoPage--; renderInfoWithPagination(); }
    });
    document.getElementById('infoNext').addEventListener('click', function() {
        const total = (window._filteredInfo || []).length;
        if (infoPage < Math.ceil(total / PER_PAGE)) { infoPage++; renderInfoWithPagination(); }
    });

    function updatePagination(total, type) {
        const totalPages = Math.ceil(total / PER_PAGE) || 1;
        const pageInfo = document.getElementById(type + 'PageInfo');
        const prevBtn = document.getElementById(type + 'Prev');
        const nextBtn = document.getElementById(type + 'Next');
        let current = type === 'news' ? newsPage : type === 'video' ? videosPage : infoPage;
        if (pageInfo) pageInfo.textContent = `${current} / ${totalPages}`;
        if (prevBtn) prevBtn.disabled = current === 1;
        if (nextBtn) nextBtn.disabled = current === totalPages;
    }

    // ===== СТАТЬЯ НОВОСТИ =====
    async function loadArticle(id) {
        const container = document.getElementById('articleContent');
        container.innerHTML = `<div style="text-align:center;color:#ffffff;padding:40px 0;">Загрузка статьи...</div>`;
        try {
            const res = await fetch(`${BASE_URL}/News/${id}.json`);
            if (!res.ok) throw new Error('Статья не найдена');
            const data = await res.json();
            container.innerHTML = `
                <div class="article-date">${formatDateFromId(id)}</div>
                <div class="article-title">${data.title}</div>
                <div class="article-author">${data.author || 'Автор не указан'}</div>
                <div class="article-text">${formatTextWithImages(data.fullText)}</div>
            `;
            document.title = `${data.title} — OSNW`;
        } catch (error) {
            container.innerHTML = `
                <div style="text-align:center;color:#ffffff;">
                    Статья не найдена<br>
                    <span style="font-size:13px;color:#FFFFFF;">Файл News/${id}.json отсутствует</span>
                </div>
            `;
        }
    }

    // ===== СТАТЬЯ ИНФОРМАЦИИ =====
    async function loadInfoArticle(id) {
        const container = document.getElementById('infoArticleContent');
        container.innerHTML = `<div style="text-align:center;color:#ffffff;padding:40px 0;">Загрузка...</div>`;
        try {
            const res = await fetch(`${BASE_URL}/Infoall/${id}.json`);

                <div class="article-title">${data.title}</div>

                <div style="text-align:center;color:#ffffff;">

                    <span style="font-size:13px;color:#FFFFFF;">Файл Infoall/${id}.json отсутствует</span>

    // ===== ПОЛНОЭКРАННЫЙ РЕЖИМ =====
    document.getElementById('fullscreenBtn').addEventListener('click', function() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
        }
    });

    // ===== I КНОПКА =====
    document.getElementById('InfoSite').addEventListener('click', function() {
        showPage('infosite');
        loadInfoSite();
    });

    function loadInfoSite() {
        const container = document.getElementById('infoSiteContent');
        container.innerHTML = `
            <div class="article-title">Информация о сайте чтоль</div>
            <div class="article-text">Потом напишу потому что мне ща лень чото <b>хы</b>.</div>
        `;
    }
            // ===== SUPABASE ЧАТ =====
        const SUPABASE_URL = 'https://wzoaqihzbfigsjmzumcr.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ecBRJoPfAofNIJIeZPQtMA_orQSCboi';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let chatLoaded = false;
        let chatOffset = 0;
        const CHAT_LIMIT = 30;
        let chatTotalLoaded = 0;

        async function loadChat() {
            if (chatLoaded) return;
            chatLoaded = true;
            chatOffset = 0;
            chatTotalLoaded = 0;

            const chatBox = document.getElementById('chatBox');
            const usernameInput = document.getElementById('chatUsername');
            const messageInput = document.getElementById('chatMessage');
            const sendBtn = document.getElementById('chatSendBtn');
            const loadMoreBtn = document.getElementById('loadMoreBtn');

            async function loadMessages(reset = true) {
                if (reset) {
                    chatOffset = 0;
                    chatTotalLoaded = 0;
                    chatBox.innerHTML = '';
                }
                try {
                    const { data, error } = await supabaseClient
                        .from('messages')
                        .select('*')
                        .order('created_at', { ascending: false })
                        .range(chatOffset, chatOffset + CHAT_LIMIT - 1);

                    if (error) throw error;

                    if (data.length === 0 && chatTotalLoaded === 0) {
                        chatBox.innerHTML = `<div class="no-data">Пока сообщений нет. Напиши первым!</div>`;
                        loadMoreBtn.style.display = 'none';
                        return;
                    }

                    if (reset) {
                        chatBox.innerHTML = '';
                        chatTotalLoaded = 0;
                    }

                    data.reverse();
                    data.forEach(msg => {
                        const div = document.createElement('div');
                        div.style.cssText = 'margin-bottom: 10px; border-bottom: 1px solid #2a2f3a; padding-bottom: 8px;';
                        div.innerHTML = `
                            <span style="color: #6a8aff; font-weight: 600;">${escapeHtml(msg.username)}</span>
                            <span style="color: #5a6a8a; font-size: 11px; margin-left: 8px;">${new Date(msg.created_at).toLocaleTimeString()}</span>
                            <div style="color: #fff; margin-top: 2px;">${escapeHtml(msg.content)}</div>
                        `;
                        chatBox.appendChild(div);
                    });
                    chatTotalLoaded += data.length;
                    chatOffset += data.length;

                    if (data.length === CHAT_LIMIT) {
                        loadMoreBtn.style.display = 'inline-block';
                    } else {
                        loadMoreBtn.style.display = 'none';
                    }
                    chatBox.scrollTop = chatBox.scrollHeight;
                } catch (error) {
                    chatBox.innerHTML = `<div class="no-data">Ошибка загрузки сообщений</div>`;
                    console.error('Ошибка чата:', error);
                }
            }

            async function sendMessage() {
                const username = usernameInput.value.trim() || 'Аноним';
                const content = messageInput.value.trim();
                if (!content) return;
                try {
                    const { error } = await supabaseClient.from('messages').insert([{ username, content }]);
                    if (error) throw error;
                    messageInput.value = '';
                    messageInput.focus();
                    await loadMessages(true);
                } catch (error) {
                    alert('Ошибка отправки: ' + error.message);
                }
            }

            // Подписка на новые сообщения
            supabaseClient
                .channel('messages')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, () => {
                    loadMessages(true);
                })
                .subscribe();

            sendBtn.addEventListener('click', sendMessage);
            messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') sendMessage();
            });
            loadMoreBtn.addEventListener('click', function() {
                loadMessages(false);
            });

            await loadMessages(true);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.querySelector('[data-page="chat"]')?.addEventListener('click', function() {
            setTimeout(loadChat, 100);
        });
    </script>
