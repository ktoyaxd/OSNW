<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Old Strike Website News</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #202126;
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background-image: url('Icons/OS_logo.png');
            background-repeat: repeat;
            background-size: 80px 80px;
            opacity: 0.06;
            pointer-events: none;
            z-index: 0;
            animation: scrollDiagonal 30s linear infinite;
        }
        @keyframes scrollDiagonal {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            100% {
                transform: translate(300px, -150px) rotate(0deg);
            }
        }

        .fullscreen-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 40px;
            height: 40px;
            background: #3A3F45;
            border: 1px solid #363940;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
            z-index: 999;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .fullscreen-btn:hover {
            background: #363940;
            border-color: #FFFFFF;
        }

        .container {
            width: 100%;
            max-width: 900px;
            position: relative;
            z-index: 1;
        }

        /* ===== ЛОГО И МЕНЮ ===== */
        .logo {
            text-align: center;
            margin: 20px 0 30px;
        }
        .logo img {
            width: 120px;
            height: auto;
        }

        .main-title {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .menu-btn {
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 0 auto 16px;
            padding: 16px;
            background: #3A3F45;
            border: 1px solid #363940;
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .menu-btn:hover {
            background: #363940;
            border-color: #FFFFFF;
            transform: translateY(-2px);
        }

        .menu-btn.sub {
            max-width: 200px;
            font-size: 15px;
            padding: 14px;
            margin-top: 4px;
            text-decoration: none;
            color: #fff;
        }

        .sub-menu {
            display: none;
            margin-top: 10px;
        }
        .sub-menu.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== СТРАНИЦЫ ===== */
        .page {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .page.active {
            display: block;
        }

        /* ===== ТОП-БАР (назад + поиск) ===== */
        .top-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .back-btn {
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            padding: 8px 16px;
            border: 1px solid #363940;
            background: #3A3F45;
            transition: background 0.3s;
            cursor: pointer;
            white-space: nowrap;
        }
        .back-btn:hover {
            background: #363940;
            border-color: #FFFFFF;
        }
        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 10px 16px;
            border: 1px solid #363940;
            background: #3A3F45;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            transition: border 0.3s;
        }
        .search-box:focus {
            border-color: #ffffff;
        }
        .search-box::placeholder {
            color: #ffffff;
            opacity: 0.6;
        }

        /* ===== СЕТКА КАРТОЧЕК ===== */
        .grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .card {
            background: #3A3F45;
            border: 1px solid #363940;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: fadeIn 0.5s ease forwards;
            opacity: 0;
        }
        .card:hover {
            background: #363940;
            border-color: #FFFFFF;
            transform: translateY(-3px);
        }
        .card .date {
            color: #FFFFFF;
            font-size: 13px;
            font-weight: 600;
            opacity: 0.7;
        }
        .card .title {
            font-size: 20px;
            font-weight: 700;
            margin: 8px 0 6px;
        }
        .card .preview {
            color: #ffffff;
            font-size: 14px;
            line-height: 1.5;
        }
        .card .author {
            color: #FFFFFF;
            font-size: 12px;
            margin-top: 12px;
            opacity: 0.7;
        }
        .card .thumb {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            margin-bottom: 10px;
            border: 1px solid #363940;
            background: #202126;
        }
        .no-data {
            text-align: center;
            color: #FFFFFF;
            padding: 40px 0;
        }

        /* ===== СТАТЬЯ ===== */
        .article-title {
            font-size: 28px;
            font-weight: 700;
            margin: 10px 0 16px;
        }
        .article-author {
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 20px;
            opacity: 0.7;
        }
        .article-text p {
            color: #FFFFFF;
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 12px;
        }
        .inline-image {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            margin: 12px 0;
            border: 1px solid #363940;
            background: #202126;
        }
        .article-date {
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            opacity: 0.7;
        }

        /* ===== АДАПТИВ ===== */
        @media (min-width: 768px) {
            body {
                padding: 40px;
            }
            .grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
            }
            .card .title {
                font-size: 18px;
            }
        }
        @media (max-width: 767px) {
            .container {
                padding: 0 10px;
            }
            .fullscreen-btn {
                width: 34px;
                height: 34px;
                font-size: 16px;
                top: 10px;
                right: 10px;
            }
            .logo img {
                width: 80px;
            }
            .main-title {
                font-size: 22px;
            }
            .menu-btn {
                font-size: 16px;
                padding: 14px;
            }
            .article-title {
                font-size: 22px;
            }
            .article-text p {
                font-size: 15px;
            }
            .inline-image {
                max-height: 250px;
            }
        }
    </style>
</head>
<body>

    <button class="fullscreen-btn" id="fullscreenBtn">⛶</button>

    <div class="container">

        <!-- ===== ГЛАВНОЕ МЕНЮ ===== -->
        <div id="page-menu" class="page active">
            <div class="logo">
                <img src="Icons/logo.png" alt="Old Strike Website News">
            </div>
            <div class="main-title">OLD STRIKE<br>WEBSITE NEWS</div>

            <div class="menu-btn" id="readBtn">Читать</div>
            <div class="sub-menu" id="subMenu">
                <div class="menu-btn sub" data-page="news">Новости</div>
                <div class="menu-btn sub" data-page="videos">Видео</div>
                <div class="menu-btn sub" data-page="infoall">Информация</div>
            </div>
        </div>

        <!-- ===== НОВОСТИ ===== -->
        <div id="page-news" class="page">
            <div class="top-bar">
                <div class="back-btn" data-back="menu">← Назад</div>
                <input class="search-box" placeholder="Поиск новостей..." id="newsSearch">
            </div>
            <div class="grid" id="newsGrid"><div class="no-data">Загрузка новостей...</div></div>
        </div>

        <!-- ===== ВИДЕО ===== -->
        <div id="page-videos" class="page">
            <div class="top-bar">
                <div class="back-btn" data-back="menu">← Назад</div>
                <input class="search-box" placeholder="Поиск видео..." id="videoSearch">
            </div>
            <div class="grid" id="videoGrid"><div class="no-data">Загрузка видео...</div></div>
        </div>

        <!-- ===== ИНФОРМАЦИЯ ===== -->
        <div id="page-infoall" class="page">
            <div class="top-bar">
                <div class="back-btn" data-back="menu">← Назад</div>
                <input class="search-box" placeholder="Поиск информации..." id="infoSearch">
            </div>
            <div class="grid" id="infoGrid"><div class="no-data">Загрузка информации...</div></div>
        </div>

        <!-- ===== СТАТЬЯ (универсальная) ===== -->
        <div id="page-article" class="page">
            <div class="top-bar">
                <div class="back-btn" data-back="back">← Назад</div>
            </div>
            <div id="articleContent"><div class="no-data">Выберите статью</div></div>
        </div>

    </div>

    <script>
        const BASE = 'https://ktoyaxd.github.io/OSNW';

        // ===== НАВИГАЦИЯ =====
        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + id).classList.add('active');
        }

        // Кнопки "Назад"
        document.querySelectorAll('[data-back]').forEach(btn => {
            btn.addEventListener('click', function() {
                const target = this.dataset.back;
                if (target === 'menu') showPage('menu');
                else if (target === 'back') {
                    // Возврат к последней открытой странице
                    const active = document.querySelector('.nav-page.active');
                    if (active) showPage(active.dataset.page);
                    else showPage('menu');
                }
            });
        });

        // Кнопки подменю
        document.querySelectorAll('[data-page]').forEach(btn => {
            btn.addEventListener('click', function() {
                const page = this.dataset.page;
                showPage(page);
                // Загружаем данные, если ещё не загружены
                if (page === 'news' && !window.newsLoaded) loadNews();
                if (page === 'videos' && !window.videosLoaded) loadVideos();
                if (page === 'infoall' && !window.infoLoaded) loadInfoAll();
            });
        });

        // Кнопка "Читать"
        document.getElementById('readBtn').addEventListener('click', function() {
            document.getElementById('subMenu').classList.toggle('show');
        });

        // ===== ФУНКЦИЯ ДЛЯ ТЕКСТА С КАРТИНКАМИ =====
        function formatText(text) {
            if (!text) return '';
            const lines = text.split('\n');
            let html = '';
            for (let line of lines) {
                const t = line.trim();
                if (t.startsWith('img:')) {
                    const src = t.replace('img:', '').trim();
                    html += `<img class="inline-image" src="${src}" onerror="this.style.display='none'">`;
                } else if (t === '') {
                    html += '<br>';
                } else {
                    html += `<p>${t}</p>`;
                }
            }
            return html;
        }

        // ===== ФОРМАТ ДАТЫ ИЗ ID =====
        function formatDateFromId(id) {
            if (!id || id.length < 12) return id;
            return id.slice(0, 2) + '.' + id.slice(2, 4) + '.' + id.slice(4, 8) + ' ' + id.slice(8, 10) + ':' + id.slice(10,
            12);
        }

        // ===== НОВОСТИ =====
        async function loadNews() {
            window.newsLoaded = true;
            try {
                const list = await fetch(`${BASE}/News/list.json`).then(r => r.json());
                const data = await Promise.all(list.map(async id => {
                    const res = await fetch(`${BASE}/News/${id}.json`);
                    const json = await res.json();
                    json._id = id;
                    return json;
                }));
                window.allNews = data.sort((a, b) => b._id.localeCompare(a._id));
                renderNews(window.allNews);
            } catch (e) {
                document.getElementById('newsGrid').innerHTML = `<div class="no-data">Ошибка загрузки новостей</div>`;
            }
        }

        function renderNews(arr) {
            const grid = document.getElementById('newsGrid');
            if (!arr || !arr.length) return grid.innerHTML = `<div class="no-data">Новостей нет</div>`;
            grid.innerHTML = '';
            arr.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = (index * 0.08) + 's';
                card.innerHTML = `
                    <div class="date">${formatDateFromId(item._id)}</div>
                    <div class="title">${item.title}</div>
                    <div class="preview">${item.preview || ''}</div>
                    <div class="author">${item.author || ''}</div>
                `;
                card.onclick = () => openArticle('news', item._id);
                grid.appendChild(card);
            });
        }

        document.getElementById('newsSearch').addEventListener('input', function() {
            const q = this.value.toLowerCase();
            if (!window.allNews) return;
            renderNews(window.allNews.filter(i =>
                i.title.toLowerCase().includes(q) ||
                (i.preview || '').toLowerCase().includes(q) ||
                (i.author || '').toLowerCase().includes(q)
            ));
        });

        // ===== ВИДЕО =====
        async function loadVideos() {
            window.videosLoaded = true;
            try {
                window.allVideos = await fetch(`${BASE}/Videos/list.json`).then(r => r.json());
                renderVideos(window.allVideos);
            } catch (e) {
                document.getElementById('videoGrid').innerHTML = `<div class="no-data">Ошибка загрузки видео</div>`;
            }
        }

        function renderVideos(arr) {
            const grid = document.getElementById('videoGrid');
            if (!arr || !arr.length) return grid.innerHTML = `<div class="no-data">Видео нет</div>`;
            grid.innerHTML = '';
            arr.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = (index * 0.08) + 's';
                card.innerHTML = `
                    <img class="thumb" src="https://img.youtube.com/vi/${item.id}/mqdefault.jpg" onerror="this.style.display='none'">
                    <div class="title">${item.title}</div>
                    <div class="preview">${item.channel || ''}</div>
                    <div class="author">${item.date || ''}</div>
                `;
                card.onclick = () => window.open(`https://www.youtube.com/watch?v=${item.id}`, '_blank');
                grid.appendChild(card);
            });
        }

        document.getElementById('videoSearch').addEventListener('input', function() {
            const q = this.value.toLowerCase();
            if (!window.allVideos) return;
            renderVideos(window.allVideos.filter(i =>
                i.title.toLowerCase().includes(q) ||
                (i.channel || '').toLowerCase().includes(q)
            ));
        });

        // ===== ИНФОРМАЦИЯ =====
        async function loadInfoAll() {
            window.infoLoaded = true;
            try {
                const list = await fetch(`${BASE}/Infoall/list.json`).then(r => r.json());
                const data = await Promise.all(list.map(async id => {
                    const res = await fetch(`${BASE}/Infoall/${id}.json`);
                    return await res.json();
                }));
                window.allInfo = data;
                renderInfo(window.allInfo);
            } catch (e) {
                document.getElementById('infoGrid').innerHTML = `<div class="no-data">Ошибка загрузки информации</div>`;
            }
        }

        function renderInfo(arr) {
            const grid = document.getElementById('infoGrid');
            if (!arr || !arr.length) return grid.innerHTML = `<div class="no-data">Информации нет</div>`;
            grid.innerHTML = '';
            arr.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = (index * 0.08) + 's';
                card.innerHTML = `
                    <div class="title">${item.title}</div>
                    <div class="preview">${item.preview || ''}</div>
                `;
                card.onclick = () => openArticle('info', index);
                grid.appendChild(card);
            });
        }

        document.getElementById('infoSearch').addEventListener('input', function() {
            const q = this.value.toLowerCase();
            if (!window.allInfo) return;
            renderInfo(window.allInfo.filter(i =>
                i.title.toLowerCase().includes(q) ||
                (i.preview || '').toLowerCase().includes(q)
            ));
        });

        // ===== ОТКРЫТИЕ СТАТЬИ =====
        async function openArticle(type, id) {
            showPage('article');
            const container = document.getElementById('articleContent');
            container.innerHTML = '<div class="no-data">Загрузка...</div>';

            try {
                let data;
                if (type === 'news') {
                    const res = await fetch(`${BASE}/News/${id}.json`);
                    data = await res.json();
                    container.innerHTML = `
                        <div class="article-date">${formatDateFromId(id)}</div>
                        <div class="article-title">${data.title}</div>
                        <div class="article-author">${data.author || ''}</div>
                        <div class="article-text">${formatText(data.fullText)}</div>
                    `;
                } else if (type === 'info') {
                    data = window.allInfo[id];
                    if (data) {
                        container.innerHTML = `
                            <div class="article-title">${data.title}</div>
                            <div class="article-text">${formatText(data.fullText)}</div>
                        `;
                    } else {
                        container.innerHTML = '<div class="no-data">Статья не найдена</div>';
                    }
                }
            } catch (e) {
                container.innerHTML = '<div class="no-data">Ошибка загрузки статьи</div>';
            }
        }

        // ===== ПОЛНОЭКРАННЫЙ РЕЖИМ =====
        document.getElementById('fullscreenBtn').addEventListener('click', function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        // ===== АВТОЗАГРУЗКА =====
        // Стартуем с меню, новости загружаем при первом открытии
    </script>

</body>
</html>
