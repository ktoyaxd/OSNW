<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Old Strike Website News</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #202126;
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background-image: url('Icons/OS_logo.png');
            background-repeat: repeat;
            background-size: 80px 80px;
            opacity: 0.06;
            pointer-events: none;
            z-index: 0;
            animation: scrollDiagonal 30s linear infinite;
        }

        @keyframes scrollDiagonal {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            100% {
                transform: translate(300px, -150px) rotate(0deg);
            }
        }

        .fullscreen-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 40px;
            height: 40px;
            background: #3A3F45;
            border: 1px solid #363940;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
            z-index: 999;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .fullscreen-btn:hover {
            background: #363940;
            border-color: #FFFFFF;
        }

        .container {
            width: 100%;
            max-width: 600px;
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .logo {
            margin-bottom: 40px;
        }
        .logo img {
            width: 1200px;
            height: auto;
        }

        .main-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .menu-btn {
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 0 auto 16px;
            padding: 16px;
            background: #3A3F45;
            border: 1px solid #363940;
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .menu-btn:hover {
            background: #363940;
            border-color: #FFFFFF;
            transform: translateY(-2px);
        }

        .menu-btn.sub {
            max-width: 200px;
            font-size: 15px;
            padding: 14px;
            margin-top: 4px;
            text-decoration: none;
            color: #fff;
        }

        .menu-btn.hidden {
            display: none;
        }

        .sub-menu {
            display: none;
            margin-top: 10px;
        }

        .sub-menu.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 767px) {
            .logo img {
                width: 80px;
            }
            .main-title {
                font-size: 22px;
            }
            .menu-btn {
                font-size: 16px;
                padding: 14px;
            }
            .fullscreen-btn {
                width: 34px;
                height: 34px;
                font-size: 16px;
                top: 10px;
                right: 10px;
            }
        }
    </style>
</head>
<body>

    <button class="fullscreen-btn" id="fullscreenBtn">⛶</button>

    <div class="container">
        <div class="logo">
            <img src="https://ktoyaxd.github.io/OSNW/Icons/logo.png" alt="Old Strike Website News">
        </div>
        

        <!-- Кнопка "Читать" -->
        <div class="menu-btn" id="readBtn">Читать</div>

        <!-- Подменю (изначально скрыто) -->
        <div class="sub-menu" id="subMenu">
            <a href="infoall.html" class="menu-btn sub">Информация о всём по игре и прочее</a>
            <a href="news.html" class="menu-btn sub">Новости</a>
            <a href="videos.html" class="menu-btn sub">Видео</a>
        </div>
    </div>

    <script>
        const readBtn = document.getElementById('readBtn');
        const subMenu = document.getElementById('subMenu');

        readBtn.addEventListener('click', function() {
            // Скрываем кнопку "Читать"
            this.classList.add('hidden');
            // Показываем подменю
            subMenu.classList.add('show');
        });

        // Полноэкранный режим
        const fsBtn = document.getElementById('fullscreenBtn');
        fsBtn.addEventListener('click', function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });
    </script>

</body>
</html>
