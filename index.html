<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Old Strike Website News</title>
    <style>
        /* ===== ОБЩИЕ СТИЛИ (из i.html) ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #202126;
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background-image: url('Icons/OS_logo.png');
            background-repeat: repeat;
            background-size: 80px 80px;
            opacity: 0.06;
            pointer-events: none;
            z-index: 0;
            animation: scrollDiagonal 30s linear infinite;
        }
        @keyframes scrollDiagonal {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(300px, -150px) rotate(0deg); }
        }

        .fullscreen-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 40px;
            height: 40px;
            background: #3A3F45;
            border: 1px solid #363940;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
            z-index: 999;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .fullscreen-btn:hover {
            background: #363940;
            border-color: #FFFFFF;
        }

        .container {
            width: 100%;
            max-width: 900px;
            position: relative;
            z-index: 1;
        }

        /* ===== СТИЛИ ГЛАВНОГО МЕНЮ (из i.html) ===== */
        .menu-container {
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }
        .logo {
            margin-bottom: 40px;
        }
        .logo img {
            width: 250px;
            height: auto;
        }
        .main-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }
        .menu-btn {
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 0 auto 16px;
            padding: 16px;
            background: #3A3F45;
            border: 1px solid #363940;
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .menu-btn:hover {
            background: #363940;
            border-color: #FFFFFF;
            transform: translateY(-2px);
        }
        .menu-btn.sub {
            max-width: 200px;
            font-size: 15px;
            padding: 14px;
            margin-top: 4px;
            text-decoration: none;
            color: #fff;
        }
        .menu-btn.hidden {
            display: none;
        }
        .sub-menu {
            display: none;
            margin-top: 10px;
        }
        .sub-menu.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== СТИЛИ ДЛЯ ВСЕХ СТРАНИЦ (из news.html, videos.html, infoall.html) ===== */
        .page {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .page.active {
            display: block;
        }

        .top-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .back-btn {
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            padding: 8px 16px;
            border: 1px solid #363940;
            background: #3A3F45;
            transition: background 0.3s;
            cursor: pointer;
            white-space: nowrap;
        }
        .back-btn:hover {
            background: #363940;
            border-color: #FFFFFF;
        }
        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 10px 16px;
            border: 1px solid #363940;
            background: #3A3F45;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            transition: border 0.3s;
        }
        .search-box:focus {
            border-color: #ffffff;
        }
        .search-box::placeholder {
            color: #ffffff;
            opacity: 0.6;
        }

        /* Сетка карточек */
        .grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .card {
            background: #3A3F45;
            border: 1px solid #363940;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: fadeIn 0.5s ease forwards;
            opacity: 0;
        }
        .card:hover {
            background: #363940;
            border-color: #FFFFFF;
            transform: translateY(-3px);
        }
        .card .date {
            color: #FFFFFF;
            font-size: 13px;
            font-weight: 600;
            opacity: 0.7;
        }
        .card .title {
            font-size: 20px;
            font-weight: 700;
            margin: 8px 0 6px;
        }
        .card .preview {
            color: #ffffff;
            font-size: 14px;
            line-height: 1.5;
        }
        .card .author {
            color: #FFFFFF;
            font-size: 12px;
            margin-top: 12px;
            opacity: 0.7;
        }
        .card .thumb {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            margin-bottom: 10px;
            border: 1px solid #363940;
            background: #202126;
        }
        .no-data {
            text-align: center;
            color: #FFFFFF;
            padding: 40px 0;
        }

        /* Стили для статей (из article.html и info_article.html) */
        .article-container {
            background: #3A3F45;
            border: 1px solid #363940;
            padding: 30px;
            animation: fadeIn 0.5s ease;
        }
        .article-title {
            font-size: 28px;
            font-weight: 700;
            margin: 10px 0 16px;
        }
        .article-author {
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 20px;
            opacity: 0.7;
        }
        .article-date {
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            opacity: 0.7;
        }
        .article-text p {
            color: #FFFFFF;
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 12px;
        }
        .inline-image {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            margin: 12px 0;
            border: 1px solid #363940;
            background: #202126;
        }

        /* Адаптив */
        @media (min-width: 768px) {
            body { padding: 40px; }
            .grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
            }
            .card .title { font-size: 18px; }
        }
        @media (max-width: 767px) {
            .container { padding: 0 10px; }
            .fullscreen-btn {
                width: 34px;
                height: 34px;
                font-size: 16px;
                top: 10px;
                right: 10px;
            }
            .logo img { width: 200px; }
            .main-title { font-size: 22px; }
            .menu-btn { font-size: 16px; padding: 14px; }
            .article-title { font-size: 22px; }
            .article-text p { font-size: 15px; }
            .inline-image { max-height: 250px; }
            .article-container { padding: 20px; }
        }
    </style>
</head>
<body>

    <button class="fullscreen-btn" id="fullscreenBtn">⛶</button>

    <div class="container">

        <!-- ===== ГЛАВНОЕ МЕНЮ (i.html) ===== -->
        <div id="page-menu" class="page active">
            <div class="menu-container">
                <div class="logo">
                    <img src="Icons/logo.png" alt="Old Strike Website News">
                </div>
                <div class="menu-btn" id="readBtn">Читать</div>
                <div class="sub-menu" id="subMenu">
                    <div class="menu-btn sub" data-page="infoall">Информация о всём по игре и прочее</div>
                    <div class="menu-btn sub" data-page="news">Новости</div>
                    <div class="menu-btn sub" data-page="videos">Видео</div>
                </div>
            </div>
        </div>

        <!-- ===== НОВОСТИ (news.html) ===== -->
        <div id="page-news" class="page">
            <div class="top-bar">
                <div class="back-btn" data-back="menu">Назад</div>
                <input class="search-box" placeholder="Поиск новостей..." id="newsSearch">
            </div>
            <div class="grid" id="newsGrid"><div class="no-data">Загрузка новостей...</div></div>
        </div>

        <!-- ===== ВИДЕО (videos.html) ===== -->
        <div id="page-videos" class="page">
            <div class="top-bar">
                <div class="back-btn" data-back="menu">← Назад</div>
                <input class="search-box" placeholder="Поиск видео..." id="videoSearch">
            </div>
            <div class="grid" id="videoGrid"><div class="no-data">Загрузка видео...</div></div>
        </div>

        <!-- ===== ИНФОРМАЦИЯ (infoall.html) ===== -->
        <div id="page-infoall" class="page">
            <div class="top-bar">
                <div class="back-btn" data-back="menu">← Назад</div>
                <input class="search-box" placeholder="Поиск информации..." id="infoSearch">
            </div>
            <div class="grid" id="infoGrid"><div class="no-data">Загрузка...</div></div>
        </div>

        <!-- ===== СТАТЬЯ НОВОСТИ (article.html) ===== -->
        <div id="page-article" class="page">
            <div class="top-bar">
                <div class="back-btn" data-back="back">← Назад к новостям</div>
            </div>
            <div class="article-container" id="articleContent">
                <div style="text-align:center;color:#ffffff;padding:40px 0;">Загрузка статьи...</div>
            </div>
        </div>

        <!-- ===== СТАТЬЯ ИНФОРМАЦИИ (info_article.html) ===== -->
        <div id="page-info-article" class="page">
            <div class="top-bar">
                <div class="back-btn" data-back="back">← Назад</div>
            </div>
            <div class="article-container" id="infoArticleContent">
                <div style="text-align:center;color:#ffffff;padding:40px 0;">Загрузка...</div>
            </div>
        </div>

    </div>

    <script>
        // ===== ОБЩИЕ ПЕРЕМЕННЫЕ =====
        const BASE_URL = 'https://ktoyaxd.github.io/OSNW';

        // ===== НАВИГАЦИЯ =====
        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + id).classList.add('active');
        }

        // Кнопки "Назад"
        document.querySelectorAll('[data-back]').forEach(btn => {
            btn.addEventListener('click', function() {
                const target = this.dataset.back;
                if (target === 'menu') showPage('menu');
                else if (target === 'back') {
                    // Возврат к последней открытой странице
                    const active = document.querySelector('.nav-page.active');
                    if (active) showPage(active.dataset.page);
                    else showPage('menu');
                }
            });
        });

        // Кнопки подменю
        document.querySelectorAll('[data-page]').forEach(btn => {
            btn.addEventListener('click', function() {
                const page = this.dataset.page;
                showPage(page);
                if (page === 'news' && !window.newsLoaded) loadNews();
                if (page === 'videos' && !window.videosLoaded) loadVideos();
                if (page === 'infoall' && !window.infoLoaded) loadInfoAll();
            });
        });

        // Кнопка "Читать" (из i.html)
        document.getElementById('readBtn').addEventListener('click', function() {
            this.classList.add('hidden');
            document.getElementById('subMenu').classList.add('show');
        });

        // ===== ФУНКЦИИ ДЛЯ ТЕКСТА =====
        function formatDateFromId(id) {
            if (!id || id.length < 12) return id;
            return id.slice(0, 2) + '.' + id.slice(2, 4) + '.' + id.slice(4, 8) + ' ' + id.slice(8, 10) + ':' + id.slice(10, 12);
        }

        function formatTextWithImages(text) {
            if (!text) return '';
            const lines = text.split('\n');
            let html = '';
            for (let line of lines) {
                const trimmed = line.trim();
                if (trimmed.startsWith('img:')) {
                    const imagePath = trimmed.replace('img:', '').trim();
                    html += `<img class="inline-image" src="${imagePath}" alt="Изображение" onerror="this.style.display='none'">`;
                } else if (trimmed === '') {
                    html += '<br>';
                } else {
                    html += `<p>${trimmed}</p>`;
                }
            }
            return html;
        }

        // ===== НОВОСТИ (из news.html) =====
        async function loadNews() {
            window.newsLoaded = true;
            try {
                const listRes = await fetch(`${BASE_URL}/News/list.json`);
                if (!listRes.ok) throw new Error('Ошибка загрузки list.json');
                const files = await listRes.json();

                const newsPromises = files.map(async (id) => {
                    const res = await fetch(`${BASE_URL}/News/${id}.json`);
                    if (!res.ok) throw new Error(`Ошибка загрузки ${id}`);
                    const data = await res.json();
                    data._id = id;
                    data._date = formatDateFromId(id);
                    return data;
                });

                window.allNews = await Promise.all(newsPromises);
                window.allNews.sort((a, b) => b._id.localeCompare(a._id));
                renderNews(window.allNews);
            } catch (error) {
                document.getElementById('newsGrid').innerHTML = `
                    <div class="no-data">Не удалось загрузить новости<br><span style="font-size:13px;">Ошибка: ${error.message}</span></div>
                `;
            }
        }

        function renderNews(newsArray) {
            const grid = document.getElementById('newsGrid');
            if (!newsArray || newsArray.length === 0) {
                grid.innerHTML = `<div class="no-data">Новостей не найдено</div>`;
                return;
            }
            grid.innerHTML = '';
            newsArray.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = `${index * 0.08}s`;
                card.innerHTML = `
                    <div class="date">${item._date}</div>
                    <div class="title">${item.title}</div>
                    <div class="preview">${item.preview || ''}</div>
                    <div class="author">${item.author || 'Автор не указан'}</div>
                `;
                card.addEventListener('click', () => {
                    window.currentArticleId = item._id;
                    showPage('article');
                    loadArticle(item._id);
                });
                grid.appendChild(card);
            });
        }

        document.getElementById('newsSearch').addEventListener('input', function() {
            const query = this.value.toLowerCase().trim();
            if (!window.allNews) return;
            if (!query) { renderNews(window.allNews); return; }
            const filtered = window.allNews.filter(item =>
                item.title.toLowerCase().includes(query) ||
                (item.preview || '').toLowerCase().includes(query) ||
                (item.author || '').toLowerCase().includes(query)
            );
            renderNews(filtered);
        });

        // ===== ВИДЕО (из videos.html) =====
        async function loadVideos() {
            window.videosLoaded = true;
            try {
                const listRes = await fetch(`${BASE_URL}/Videos/list.json`);
                if (!listRes.ok) throw new Error('Ошибка загрузки list.json');
                window.allVideos = await listRes.json();
                window.allVideos.sort((a, b) => {
                    const da = a.date.split('.').reverse().join('');
                    const db = b.date.split('.').reverse().join('');
                    return db.localeCompare(da);
                });
                renderVideos(window.allVideos);
            } catch (error) {
                document.getElementById('videoGrid').innerHTML = `
                    <div class="no-data">Не удалось загрузить видео<br><span style="font-size:13px;">Ошибка: ${error.message}</span></div>
                `;
            }
        }

        function renderVideos(videoArray) {
            const grid = document.getElementById('videoGrid');
            if (!videoArray || videoArray.length === 0) {
                grid.innerHTML = `<div class="no-data">Видео не найдены</div>`;
                return;
            }
            grid.innerHTML = '';
            videoArray.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = `${index * 0.08}s`;
                const thumbUrl = `https://img.youtube.com/vi/${item.id}/mqdefault.jpg`;
                card.innerHTML = `
                    <img class="thumb" src="${thumbUrl}" alt="${item.title}" loading="lazy" onerror="this.style.display='none'">
                    <div class="title">${item.title}</div>
                    <div class="preview">${item.channel || ''}</div>
                    <div class="author">${item.date || ''}</div>
                `;
                card.addEventListener('click', () => {
                    window.open(`https://www.youtube.com/watch?v=${item.id}`, '_blank');
                });
                grid.appendChild(card);
            });
        }

        document.getElementById('videoSearch').addEventListener('input', function() {
            const query = this.value.toLowerCase().trim();
            if (!window.allVideos) return;
            if (!query) { renderVideos(window.allVideos); return; }
            const filtered = window.allVideos.filter(item =>
                item.title.toLowerCase().includes(query) ||
                (item.channel || '').toLowerCase().includes(query)
            );
            renderVideos(filtered);
        });

        // ===== ИНФОРМАЦИЯ (из infoall.html) =====
        async function loadInfoAll() {
            window.infoLoaded = true;
            try {
                const listRes = await fetch(`${BASE_URL}/Infoall/list.json`);
                if (!listRes.ok) throw new Error('Ошибка загрузки list.json');
                const files = await listRes.json();

                const infoPromises = files.map(async (file) => {
                    const res = await fetch(`${BASE_URL}/Infoall/${file}`);
                    if (!res.ok) throw new Error(`Ошибка загрузки ${file}`);
                    const data = await res.json();
                    data._fileName = file.replace('.json', '');
                    return data;
                });

                window.allInfo = await Promise.all(infoPromises);
                renderInfo(window.allInfo);
            } catch (error) {
                document.getElementById('infoGrid').innerHTML = `
                    <div class="no-info">Не удалось загрузить информацию<br><span style="font-size:13px;">Ошибка: ${error.message}</span></div>
                `;
            }
        }

        function renderInfo(infoArray) {
            const grid = document.getElementById('infoGrid');
            if (!infoArray || infoArray.length === 0) {
                grid.innerHTML = `<div class="no-data">Информация не найдена</div>`;
                return;
            }
            grid.innerHTML = '';
            infoArray.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = `${index * 0.08}s`;

                let imageHtml = '';
                if (item.image) {
                    imageHtml = `<img class="thumb" src="${item.image}" alt="${item.title}" onerror="this.style.display='none'">`;
                }

                card.innerHTML = `
                    ${imageHtml}
                    <div class="title">${item.title}</div>
                    <div class="preview">${item.preview || ''}</div>
                `;
                card.addEventListener('click', () => {
                    window.currentInfoId = item._fileName || `info_${index}`;
                    showPage('info-article');
                    loadInfoArticle(window.currentInfoId);
                });
                grid.appendChild(card);
            });
        }

        document.getElementById('infoSearch').addEventListener('input', function() {
            const query = this.value.toLowerCase().trim();
            if (!window.allInfo) return;
            if (!query) { renderInfo(window.allInfo); return; }
            const filtered = window.allInfo.filter(item =>
                item.title.toLowerCase().includes(query) ||
                (item.preview || '').toLowerCase().includes(query)
            );
            renderInfo(filtered);
        });

        // ===== СТАТЬЯ НОВОСТИ (из article.html) =====
        async function loadArticle(id) {
            const container = document.getElementById('articleContent');
            container.innerHTML = `<div style="text-align:center;color:#ffffff;padding:40px 0;">Загрузка статьи...</div>`;
            try {
                const res = await fetch(`${BASE_URL}/News/${id}.json`);
                if (!res.ok) throw new Error('Статья не найдена');
                const data = await res.json();
                container.innerHTML = `
                    <div class="article-date">${formatDateFromId(id)}</div>
                    <div class="article-title">${data.title}</div>
                    <div class="article-author">${data.author || 'Автор не указан'}</div>
                    <div class="article-text">${formatTextWithImages(data.fullText)}</div>
                `;
                document.title = `${data.title} — OSNW`;
            } catch (error) {
                container.innerHTML = `
                    <div style="text-align:center;color:#ffffff;">
                        Статья не найдена<br>
                        <span style="font-size:13px;color:#FFFFFF;">Файл News/${id}.json отсутствует</span>
                    </div>
                `;
            }
        }

        // ===== СТАТЬЯ ИНФОРМАЦИИ (из info_article.html) =====
        async function loadInfoArticle(id) {
            const container = document.getElementById('infoArticleContent');
            container.innerHTML = `<div style="text-align:center;color:#ffffff;padding:40px 0;">Загрузка...</div>`;
            try {
                const res = await fetch(`${BASE_URL}/Infoall/${id}.json`);
                if (!res.ok) throw new Error('Информация не найдена');
                const data = await res.json();
                container.innerHTML = `
                    <div class="article-title">${data.title}</div>
                    <div class="article-text">${formatTextWithImages(data.fullText)}</div>
                `;
                document.title = `${data.title} — Old Strike`;
            } catch (error) {
                container.innerHTML = `
                    <div style="text-align:center;color:#ffffff;">
                        Информация не найдена<br>
                        <span style="font-size:13px;color:#FFFFFF;">Файл Infoall/${id}.json отсутствует</span>
                    </div>
                `;
            }
        }

        // ===== ПОЛНОЭКРАННЫЙ РЕЖИМ =====
        document.getElementById('fullscreenBtn').addEventListener('click', function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        // ===== АВТОЗАГРУЗКА =====
        // Стартуем с меню, остальное подгружается при клике
    </script>

</body>
</html>
