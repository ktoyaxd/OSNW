<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Old Strike News</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #202126;
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== ФОН С ПОВТОРЯЮЩЕЙСЯ ИКОНКОЙ ПОД 45° ===== */
        body::before {
            content: '';
            position: fixed;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background-image: url('Icons/bg_icon');
            background-repeat: repeat;
            background-size: 80px 80px;
            transform: rotate(45deg);
            opacity: 0.06;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 900px;
            position: relative;
            z-index: 1;
        }
        .logo {
            text-align: center;
            margin: 20px 0 30px;
        }
        .search-box {
            width: 100%;
            padding: 14px 20px;
            border-radius: 0px;
            border: 1px solid #363940;
            background: #3A3F45;
            color: #ffffff;
            font-size: 16px;
            margin-bottom: 30px;
            outline: none;
            transition: border 0.3s;
        }
        .search-box:focus {
            border-color: #FFFFFF;
        }
        .search-box::placeholder {
            color: #5a6a8a;
        }
        .news-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .news-card {
            background: #141a2a;
            border: 1px solid #2a3a5a;
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: fadeIn 0.5s ease forwards;
            opacity: 0;
        }
        .news-card:hover {
            background: #1a2240;
            border-color: #4a7aff;
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(74, 122, 255, 0.1);
        }
        .news-card .date {
            color: #6a8aff;
            font-size: 13px;
            font-weight: 600;
        }
        .news-card .title {
            font-size: 20px;
            font-weight: 700;
            margin: 8px 0 6px;
        }
        .news-card .preview {
            color: #fffff;
            font-size: 14px;
            line-height: 1.5;
        }
        .news-card .author {
            color: #FFFFFF;
            font-size: 12px;
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .no-news {
            text-align: center;
            color: #FFFFFF;
            padding: 40px 0;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (min-width: 768px) {
            body { padding: 40px; }
            .news-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
            }
            .news-card {
                animation: fadeIn 0.5s ease forwards;
            }
            .news-card .title {
                font-size: 18px;
            }
        }
        @media (max-width: 767px) {
            .container { padding: 0 10px; }
            .logo img { width: 60px; }
            .news-card .title { font-size: 17px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">
        <img src="https://ktoyaxd.github.io/OSNW/Icons/logo.png" alt="Old Strike" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2280%22%3E%3Crect width=%2280%22 height=%2280%22 fill=%22%231a2240%22/%3E%3Ctext x=%2210%22 y=%2248%22 fill=%22%234a7aff%22 font-size=%2232%22 font-weight=%22bold%22%3EOS%3C/text%3E%3C/svg%3E'">
    </div>
    <input class="search-box" placeholder="Поиск новостей..." id="searchInput">
    <div class="news-grid" id="newsGrid">
        <div class="no-news">Загрузка новостей...</div>
    </div>
</div>

<script>
    const newsGrid = document.getElementById('newsGrid');
    const searchInput = document.getElementById('searchInput');
    let allNews = [];

    // ===== БАЗОВЫЙ URL ДЛЯ GITHUB =====
    const BASE_URL = 'https://ktoyaxd.github.io/OSNW';

    async function loadNewsList() {
        try {
            // Загружаем список файлов с GitHub
            const listRes = await fetch(`${BASE_URL}/News/list.json`);
            if (!listRes.ok) throw new Error('Ошибка загрузки list.json');
            const files = await listRes.json();
            
            // Загружаем каждый файл новости
            const newsPromises = files.map(async (file) => {
                const res = await fetch(`${BASE_URL}/News/${file}`);
                if (!res.ok) throw new Error(`Ошибка загрузки ${file}`);
                return await res.json();
            });
            
            allNews = await Promise.all(newsPromises);
            
            // Сортируем по дате (свежие сверху)
            allNews.sort((a, b) => {
                const da = a.date.split('.').reverse().join('');
                const db = b.date.split('.').reverse().join('');
                return db.localeCompare(da);
            });
            
            renderNews(allNews);
        } catch (error) {
            console.error('Ошибка загрузки:', error);
            newsGrid.innerHTML = `
                <div class="no-news">
                    Не удалось загрузить новости<br>
                    <span style="font-size:13px;color:#FFFFFF;">
                        Ошибка: ${error.message}<br>
                        Проверь папку <b>news/</b> и файл <b>list.json</b> на GitHub
                    </span>
                </div>
            `;
        }
    }

    function renderNews(newsArray) {
        if (!newsArray || newsArray.length === 0) {
            newsGrid.innerHTML = `<div class="no-news">Новостей не найдено</div>`;
            return;
        }
        
        newsGrid.innerHTML = '';
        newsArray.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'news-card';
            card.style.animationDelay = `${index * 0.08}s`;
            
            card.innerHTML = `
                <div class="date">${item.date}</div>
                <div class="title">${item.title}</div>
                <div class="preview">${item.preview}</div>
                <div class="author">${item.author}</div>
            `;
            
            card.addEventListener('click', () => {
                const id = item.date.replace(/\./g, '');
                window.location.href = `article.html?id=${id}`;
            });
            
            newsGrid.appendChild(card);
        });
    }

    searchInput.addEventListener('input', function() {
        const query = this.value.toLowerCase().trim();
        if (!query) {
            renderNews(allNews);
            return;
        }
        const filtered = allNews.filter(item =>
            item.title.toLowerCase().includes(query) ||
            item.preview.toLowerCase().includes(query) ||
            item.author.toLowerCase().includes(query)
        );
        renderNews(filtered);
    });

    loadNewsList();
</script>
</body>
  </html>
