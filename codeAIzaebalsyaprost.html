<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Atlas Editor — OSNW</title>
<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden;
        background: #202126; color: #fff;
        font-family: 'Segoe UI', Arial, sans-serif; }
    #stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
    #stage canvas { position: absolute; top: 0; left: 0; image-rendering: pixelated; }

    #topHud {
        position: fixed; top: 8px; left: 8px; right: 8px;
        display: flex; gap: 6px; flex-wrap: wrap; z-index: 20;
        font-size: 11px; font-family: monospace;
    }
    #topHud > * { background: rgba(0,0,0,0.75); padding: 5px 8px;
        border: 1px solid #444; color: #fff; }
    #topHud .gold { color: #FFD700; }

    #iconPreview {
        position: fixed; top: 44px; right: 8px;
        width: 96px; height: 96px; z-index: 20;
        background: #0a0a0a; border: 1px solid #444;
        display: none; align-items: center; justify-content: center;
    }
    #iconPreview img {
        max-width: 90%; max-height: 90%;
        image-rendering: pixelated;
    }

    #bottom {
        position: fixed; bottom: 0; left: 0; right: 0;
        background: rgba(0,0,0,0.92); padding: 8px 10px 12px;
        z-index: 20; font-size: 12px; font-family: monospace;
        max-height: 60vh; overflow-y: auto;
    }
    #bottom .row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; flex-wrap: wrap; }
    #bottom input {
        background: #2D3037; color: #FFD700; border: 1px solid #444;
        padding: 6px 8px; font-family: monospace; font-size: 13px;
        min-width: 0;
    }
    #bottom input.id { flex: 1; min-width: 120px; }
    #bottom input.coord { width: 64px; }
    #bottom button {
        background: #2D3037; color: #fff; border: 1px solid #444;
        padding: 6px 10px; cursor: pointer; font-family: inherit;
        font-size: 12px;
    }
    #bottom button.gold { background: #FFD700; color: #202126; border-color: #FFD700; }
    #bottom button.red { background: #7a1e1e; border-color: #a33; }
    #list { font-size: 11px; color: #aaa; max-height: 120px; overflow-y: auto;
        white-space: pre; margin-top: 6px; padding: 4px; background: #111;
        border: 1px solid #333; }

    .plaque {
        position: absolute; border: 3px solid #ff3b3b;
        pointer-events: auto; cursor: move; z-index: 10;
        box-sizing: border-box; background: transparent;
    }
    .plaque .label {
        position: absolute; top: -20px; left: 0;
        font-size: 10px; color: #fff; background: #ff3b3b;
        padding: 1px 4px; white-space: nowrap;
    }
    .plaque::before {
        content: ''; position: absolute; inset: 0;
        background: rgba(255, 60, 60, 0.08); pointer-events: none;
    }
    .iconMark {
        position: absolute; border: 2px dashed #FFD700;
        pointer-events: none; z-index: 11; box-sizing: border-box;
    }
    .iconMark::after {
        content: 'icon'; position: absolute; top: -16px; left: 0;
        font-size: 9px; color: #202126; background: #FFD700;
        padding: 0 4px;
    }
</style>
</head>
<body>
<div id="stage"></div>

<div id="topHud">
    <span id="weaponPicker">оружие: <b>—</b></span>
    <span class="gold" id="coords">x=— y=—</span>
    <span>атлас 2048×2048</span>
</div>

<div id="iconPreview"><img id="iconPreviewImg"></div>

<div id="bottom">
    <div class="row">
        <span>model:</span>
        <input class="coord" id="defW" value="128" placeholder="w">
        <input class="coord" id="defH" value="128" placeholder="h">
        <span>cuts:</span>
        <input class="coord" id="iconTop"    value="0" placeholder="top">
        <input class="coord" id="iconBottom" value="0" placeholder="bottom">
        <input class="coord" id="iconLeft"   value="0" placeholder="left">
        <input class="coord" id="iconRight"  value="0" placeholder="right">
        <button id="applyMeta">Применить</button>
    </div>
    <div class="row">
        <span>рамка:</span>
        <input class="coord" id="xIn" value="290" placeholder="x">
        <input class="coord" id="yIn" value="812" placeholder="y">
        <button id="applyPos">Применить</button>
    </div>
    <div class="row">
        <input class="id" id="idInput" placeholder="ID скина (напр. ak47chan)">
        <input class="coord" id="nameIn" placeholder="name">
        <input class="coord" id="qualityIn" placeholder="quality" value="common">
        <button class="gold" id="saveBtn">💾 Сохранить</button>
    </div>
    <div class="row">
        <button id="centerOnPlaque">🎯 Центр</button>
        <button id="copyBtn">📋 Скопировать JSON</button>
        <button class="red" id="clearBtn">Очистить</button>
    </div>
    <div id="list">— пусто —</div>
</div>

<script>
const ATLAS_URL = 'Data/3D/WeaponsAtlas.png';
const ATLAS_SIZE = 2048;

let scale = 1, offsetX = 0, offsetY = 0;
let saved = {};
let defaults = { w: 128, h: 128 };
let icons    = { topCut: 0, bottomCut: 0, leftCut: 0, rightCut: 0 };
let plaque = null;
let iconMark = null;

const stage = document.getElementById('stage');
const coordsEl = document.getElementById('coords');

const atlasCanvas = document.createElement('canvas');
atlasCanvas.width = ATLAS_SIZE;
atlasCanvas.height = ATLAS_SIZE;
const atlasCtx = atlasCanvas.getContext('2d', { willReadFrequently: true });
stage.appendChild(atlasCanvas);

const img = new Image();
img.crossOrigin = 'anonymous';
img.onload = () => { atlasCtx.drawImage(img, 0, 0); fitToScreen(); createPlaque(); };
img.onerror = () => alert('Не загрузился атлас: ' + ATLAS_URL);
img.src = ATLAS_URL;

function fitToScreen() {
    const w = stage.clientWidth, h = stage.clientHeight;
    const s = Math.min(w / ATLAS_SIZE, h / ATLAS_SIZE);
    scale = s;
    offsetX = (w - ATLAS_SIZE * s) / 2;
    offsetY = (h - ATLAS_SIZE * s) / 2;
    applyTransform();
}
function applyTransform() {
    atlasCanvas.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
    atlasCanvas.style.transformOrigin = '0 0';
    renderPlaque();
    renderIconMark();
}

let pointers = new Map();
let lastDist = 0, lastMid = null;
stage.addEventListener('pointerdown', e => {
    if (e.target !== stage && e.target !== atlasCanvas) return;
    stage.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        lastDist = Math.hypot(a.x - b.x, a.y - b.y);
        lastMid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    }
});
stage.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        const dist = Math.hypot(a.x - b.x, a.y - b.y);
        const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
        const zoom = dist / lastDist;
        const rect = stage.getBoundingClientRect();
        const mx = mid.x - rect.left, my = mid.y - rect.top;
        const ax = (mx - offsetX) / scale;
        const ay = (my - offsetY) / scale;
        scale = Math.min(20, Math.max(0.05, scale * zoom));
        offsetX = mx - ax * scale;
        offsetY = my - ay * scale;
        offsetX += mid.x - lastMid.x;
        offsetY += mid.y - lastMid.y;
        lastDist = dist;
        lastMid = mid;
        applyTransform();
    }
});
function endPointer(e) {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) lastDist = 0;
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);

function createPlaque() {
    if (plaque && plaque.el && plaque.el.parentNode) plaque.el.remove();
    const x = parseInt(document.getElementById('xIn').value) || 290;
    const y = parseInt(document.getElementById('yIn').value) || 812;
    plaque = { x, y, w: defaults.w, h: defaults.h, el: null };

    const el = document.createElement('div');
    el.className = 'plaque';
    el.innerHTML = `<div class="label"></div>`;
    stage.appendChild(el);
    plaque.el = el;

    let dragging = false, startPx = 0, startPy = 0, startX = 0, startY = 0;
    el.addEventListener('pointerdown', e => {
        e.stopPropagation();
        dragging = true;
        startPx = e.clientX; startPy = e.clientY;
        startX = plaque.x; startY = plaque.y;
        el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove', e => {
        if (!dragging) return;
        const dx = (e.clientX - startPx) / scale;
        const dy = (e.clientY - startPy) / scale;
        plaque.x = Math.round(startX + dx);
        plaque.y = Math.round(startY + dy);
        document.getElementById('xIn').value = plaque.x;
        document.getElementById('yIn').value = plaque.y;
        renderPlaque();
        renderIconMark();
    });
    el.addEventListener('pointerup', e => {
        dragging = false;
        el.releasePointerCapture(e.pointerId);
    });
    el.addEventListener('pointercancel', () => { dragging = false; });

    renderPlaque();
    renderIconMark();
}

function renderPlaque() {
    if (!plaque || !plaque.el) return;
    const s = scale;
    const el = plaque.el;
    el.style.left = (offsetX + plaque.x * s) + 'px';
    el.style.top  = (offsetY + plaque.y * s) + 'px';
    el.style.width  = (plaque.w * s) + 'px';
    el.style.height = (plaque.h * s) + 'px';
    el.querySelector('.label').textContent =
        `x=${plaque.x} y=${plaque.y} ${plaque.w}×${plaque.h}`;
    coordsEl.textContent = `x=${plaque.x} y=${plaque.y} ${plaque.w}×${plaque.h}`;
}

function renderIconMark() {
    if (iconMark && iconMark.parentNode) iconMark.remove();
    iconMark = null;
    if (!plaque) return;

    const s = scale;
    const ix = plaque.x + icons.leftCut;
    const iy = plaque.y + icons.topCut;
    const iw = plaque.w - icons.leftCut - icons.rightCut;
    const ih = plaque.h - icons.topCut    - icons.bottomCut;

    if (iw <= 0 || ih <= 0) return;

    const el = document.createElement('div');
    el.className = 'iconMark';
    el.style.left = (offsetX + ix * s) + 'px';
    el.style.top  = (offsetY + iy * s) + 'px';
    el.style.width  = (iw * s) + 'px';
    el.style.height = (ih * s) + 'px';
    stage.appendChild(el);
    iconMark = el;

    // превью иконки
    const c = document.createElement('canvas');
    const box = 96;
    c.width = box; c.height = box;
    const ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    const sc = Math.min(box / iw, box / ih);
    const dw = iw * sc, dh = ih * sc;
    ctx.drawImage(atlasCanvas, ix, iy, iw, ih,
        (box - dw) / 2, (box - dh) / 2, dw, dh);
    const dataUrl = c.toDataURL();
    document.getElementById('iconPreview').style.display = 'flex';
    document.getElementById('iconPreviewImg').src = dataUrl;
}

document.getElementById('applyMeta').addEventListener('click', () => {
    defaults.w = parseInt(document.getElementById('defW').value) || 128;
    defaults.h = parseInt(document.getElementById('defH').value) || 128;
    icons.topCut    = parseInt(document.getElementById('iconTop').value)    || 0;
    icons.bottomCut = parseInt(document.getElementById('iconBottom').value) || 0;
    icons.leftCut   = parseInt(document.getElementById('iconLeft').value)   || 0;
    icons.rightCut  = parseInt(document.getElementById('iconRight').value)  || 0;
    if (plaque) {
        plaque.w = defaults.w;
        plaque.h = defaults.h;
        renderPlaque();
        renderIconMark();
    }
});

document.getElementById('applyPos').addEventListener('click', () => {
    if (!plaque) { createPlaque(); return; }
    plaque.x = parseInt(document.getElementById('xIn').value) || plaque.x;
    plaque.y = parseInt(document.getElementById('yIn').value) || plaque.y;
    renderPlaque();
    renderIconMark();
});

document.getElementById('centerOnPlaque').addEventListener('click', () => {
    if (!plaque) return;
    const w = stage.clientWidth, h = stage.clientHeight;
    scale = 4;
    offsetX = w / 2 - (plaque.x + plaque.w / 2) * scale;
    offsetY = h / 2 - (plaque.y + plaque.h / 2) * scale;
    applyTransform();
});

document.getElementById('saveBtn').addEventListener('click', () => {
    if (!plaque) { alert('Нет плашки'); return; }
    const id = document.getElementById('idInput').value.trim();
    if (!id) { alert('Введи ID скина'); return; }
    const name = document.getElementById('nameIn').value.trim() || id;
    const quality = document.getElementById('qualityIn').value.trim() || 'common';

    saved[id] = { name, quality, x: plaque.x, y: plaque.y };
    document.getElementById('idInput').value = '';
    document.getElementById('nameIn').value = '';
    renderList();
});

function renderList() {
    const el = document.getElementById('list');
    const keys = Object.keys(saved);
    if (keys.length === 0) { el.textContent = '— пусто —'; return; }
    el.textContent = keys.map(k => {
        const s = saved[k];
        return `${k}: { name: "${s.name}", quality: "${s.quality}", x: ${s.x}, y: ${s.y} }`;
    }).join('\n');
}

document.getElementById('copyBtn').addEventListener('click', () => {
    const out = {
        _defaults: { w: defaults.w, h: defaults.h },
        _icons: {
            topCut:    icons.topCut,
            bottomCut: icons.bottomCut,
            leftCut:   icons.leftCut,
            rightCut:  icons.rightCut,
        },
        ...saved,
    };
    const json = JSON.stringify(out, null, 2);
    if (navigator.clipboard) {
        navigator.clipboard.writeText(json).then(
            () => alert('JSON скопирован'),
            () => prompt('Скопируй вручную:', json)
        );
    } else {
        prompt('Скопируй вручную:', json);
    }
});

document.getElementById('clearBtn').addEventListener('click', () => {
    if (!confirm('Очистить список?')) return;
    saved = {};
    renderList();
});

addEventListener('resize', () => { fitToScreen(); renderPlaque(); renderIconMark(); });
</script>
</body>
</html>
