<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Atlas Editor — OSNW</title>
<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden;
        background: #202126; color: #fff;
        font-family: 'Segoe UI', Arial, sans-serif; }
    #stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
    #stage canvas { position: absolute; top: 0; left: 0; image-rendering: pixelated; }

    #topHud {
        position: fixed; top: 8px; left: 8px; right: 8px;
        display: flex; gap: 6px; flex-wrap: wrap; z-index: 20;
        font-size: 11px; font-family: monospace;
    }
    #topHud > * { background: rgba(0,0,0,0.75); padding: 5px 8px;
        border: 1px solid #444; color: #fff; }
    #topHud .gold { color: #FFD700; }

    #rightPanel {
        position: fixed; top: 46px; right: 8px; width: 140px;
        max-height: 60vh; overflow-y: auto; z-index: 20;
        background: rgba(0,0,0,0.85); border: 1px solid #444; padding: 6px;
    }
    #rightPanel h4 { margin: 0 0 6px; font-size: 11px; color: #6a8aff; }
    .skinItem {
        display: flex; align-items: center; gap: 6px;
        padding: 4px; cursor: pointer; border: 1px solid transparent;
        margin-bottom: 3px; background: #1a1b20;
    }
    .skinItem:hover, .skinItem.active { border-color: #FFD700; background: #3a2f00; }
    .skinItem img { width: 32px; height: 24px; object-fit: contain;
        image-rendering: pixelated; }
    .skinItem .nm { font-size: 10px; overflow: hidden;
        text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .skinItem .done { color: #4c4; font-size: 10px; }

    #bottom {
        position: fixed; bottom: 0; left: 0; right: 0;
        background: rgba(0,0,0,0.92); padding: 8px 10px 12px;
        z-index: 20; font-size: 12px; font-family: monospace;
        max-height: 40vh; overflow-y: auto;
    }
    #bottom .row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; flex-wrap: wrap; }
    #bottom input {
        background: #2D3037; color: #FFD700; border: 1px solid #444;
        padding: 6px 8px; font-family: monospace; font-size: 13px;
        min-width: 0;
    }
    #bottom input.coord { width: 68px; }
    #bottom button {
        background: #2D3037; color: #fff; border: 1px solid #444;
        padding: 6px 10px; cursor: pointer; font-family: inherit;
        font-size: 12px;
    }
    #bottom button.gold { background: #FFD700; color: #202126; border-color: #FFD700; }
    #bottom button.red { background: #7a1e1e; border-color: #a33; }
    #list { font-size: 11px; color: #aaa; max-height: 90px; overflow-y: auto;
        white-space: pre; margin-top: 6px; padding: 4px; background: #111;
        border: 1px solid #333; }

    .plaque {
        position: absolute; border: 3px solid #ff3b3b;
        pointer-events: auto; cursor: move; z-index: 10;
        box-sizing: border-box;
    }
    .plaque .spritePreview {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: fill; image-rendering: pixelated;
        opacity: 0.75; pointer-events: none;
    }
    .plaque .label {
        position: absolute; top: -20px; left: 0;
        font-size: 10px; color: #fff; background: #ff3b3b;
        padding: 1px 4px; white-space: nowrap;
    }
    .plaque .handle {
        position: absolute; width: 22px; height: 22px;
        background: #ff3b3b; border: 2px solid #fff;
        border-radius: 50%; z-index: 2;
    }
    .plaque .handle.br {
        right: -11px; bottom: -11px; cursor: nwse-resize;
    }
    .plaque .handle.tl {
        left: -11px; top: -11px; cursor: nwse-resize;
    }

    /* нижний колонтитул — увеличим отступ, чтобы плашка не проваливалась */
    #stage { padding-bottom: 0; }
</style>
</head>
<body>
<div id="stage"></div>

<div id="topHud">
    <span id="weaponPicker">оружие: <b>—</b></span>
    <span class="gold" id="coords">x=— y=—</span>
    <span>атлас 2048×2048</span>
</div>

<div id="rightPanel">
    <h4>Скины</h4>
    <div id="skinList">—</div>
</div>

<div id="bottom">
    <div class="row">
        <span>размер:</span>
        <input class="coord" id="wIn" value="128">
        <input class="coord" id="hIn" value="128">
        <button id="applySize">Применить</button>
        <button id="centerOnSprite">Центр на спрайт</button>
    </div>
    <div class="row">
        <button class="gold" id="saveBtn">💾 Сохранить</button>
        <button id="copyBtn">📋 Скопировать JSON</button>
        <button class="red" id="clearBtn">Очистить</button>
    </div>
    <div id="list">— пусто —</div>
</div>

<script>
// ===== Конфиг =====
const ATLAS_URL = 'Data/3D/WeaponsAtlas.png';
const ATLAS_SIZE = 2048;
const WEAPONS = {
    'AK-47': { catalog: 'Data/Catalog/Skins/AK-47.json', atlas: 'Data/3D/ak47_atlas.json' },
    'Glock': { catalog: 'Data/Catalog/Skins/Glock.json', atlas: 'Data/3D/glock_atlas.json' },
};
let currentWeapon = 'AK-47';

// ===== Состояние =====
let scale = 1, offsetX = 0, offsetY = 0;
let catalog = [];
let existing = {};
let saved = {};
let activeSkin = null;
let activeItem = null;
let plaque = null;
// plaque: { id, x, y, w, h, el, previewEl }

const stage = document.getElementById('stage');
const coordsEl = document.getElementById('coords');

// ===== Canvas атласа =====
const atlasCanvas = document.createElement('canvas');
atlasCanvas.width = ATLAS_SIZE;
atlasCanvas.height = ATLAS_SIZE;
const atlasCtx = atlasCanvas.getContext('2d', { willReadFrequently: true });
stage.appendChild(atlasCanvas);

const img = new Image();
img.crossOrigin = 'anonymous';
img.onload = () => { atlasCtx.drawImage(img, 0, 0); fitToScreen(); };
img.onerror = () => alert('Не загрузился атлас: ' + ATLAS_URL);
img.src = ATLAS_URL;

// ===== Трансформация =====
function fitToScreen() {
    const w = stage.clientWidth, h = stage.clientHeight;
    const s = Math.min(w / ATLAS_SIZE, h / ATLAS_SIZE);
    scale = s;
    offsetX = (w - ATLAS_SIZE * s) / 2;
    offsetY = (h - ATLAS_SIZE * s) / 2;
    applyTransform();
}
function applyTransform() {
    atlasCanvas.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
    atlasCanvas.style.transformOrigin = '0 0';
    renderPlaque();
}

// ===== Жесты по атласу =====
let pointers = new Map();
let lastDist = 0, lastMid = null;

stage.addEventListener('pointerdown', e => {
    if (e.target !== stage && e.target !== atlasCanvas) return;
    stage.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        lastDist = Math.hypot(a.x - b.x, a.y - b.y);
        lastMid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    }
});
stage.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        const dist = Math.hypot(a.x - b.x, a.y - b.y);
        const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
        const zoom = dist / lastDist;
        const rect = stage.getBoundingClientRect();
        const mx = mid.x - rect.left, my = mid.y - rect.top;
        const ax = (mx - offsetX) / scale;
        const ay = (my - offsetY) / scale;
        scale = Math.min(20, Math.max(0.05, scale * zoom));
        offsetX = mx - ax * scale;
        offsetY = my - ay * scale;
        offsetX += mid.x - lastMid.x;
        offsetY += mid.y - lastMid.y;
        lastDist = dist;
        lastMid = mid;
        applyTransform();
    }
});
function endPointer(e) {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) lastDist = 0;
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);

// ===== Плашка =====
function createPlaque(item) {
    if (plaque && plaque.el && plaque.el.parentNode) plaque.el.remove();
    const initial = existing[item.id] || saved[item.id] || { x: 300, y: 735, w: 128, h: 128 };
    plaque = { id: item.id, x: initial.x, y: initial.y, w: initial.w, h: initial.h, el: null, previewEl: null };
    const el = document.createElement('div');
    el.className = 'plaque';
    el.innerHTML = `
        <div class="label"></div>
        ${item.image ? `<img class="spritePreview" src="${item.image}" draggable="false">` : ''}
        <div class="handle tl" data-handle="tl"></div>
        <div class="handle br" data-handle="br"></div>
    `;
    stage.appendChild(el);
    plaque.el = el;
    plaque.previewEl = el.querySelector('.spritePreview');

    // drag — за тело плашки
    let dragging = false, startPx = 0, startPy = 0, startX = 0, startY = 0;
    el.addEventListener('pointerdown', e => {
        if (e.target.classList.contains('handle')) return;
        e.stopPropagation();
        dragging = true;
        startPx = e.clientX; startPy = e.clientY;
        startX = plaque.x; startY = plaque.y;
        el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove', e => {
        if (!dragging) return;
        const dx = (e.clientX - startPx) / scale;
        const dy = (e.clientY - startPy) / scale;
        plaque.x = Math.round(startX + dx);
        plaque.y = Math.round(startY + dy);
        renderPlaque();
    });
    el.addEventListener('pointerup', e => {
        dragging = false;
        el.releasePointerCapture(e.pointerId);
    });
    el.addEventListener('pointercancel', () => { dragging = false; });

    // ресайз за углы
    el.querySelectorAll('.handle').forEach(h => {
        let resizing = false, startPx = 0, startPy = 0;
        let sx0 = 0, sy0 = 0, sw0 = 0, sh0 = 0;
        const side = h.dataset.handle;
        h.addEventListener('pointerdown', e => {
            e.stopPropagation();
            resizing = true;
            startPx = e.clientX; startPy = e.clientY;
            sx0 = plaque.x; sy0 = plaque.y; sw0 = plaque.w; sh0 = plaque.h;
            h.setPointerCapture(e.pointerId);
        });
        h.addEventListener('pointermove', e => {
            if (!resizing) return;
            const dx = (e.clientX - startPx) / scale;
            const dy = (e.clientY - startPy) / scale;
            if (side === 'br') {
                plaque.w = Math.max(4, Math.round(sw0 + dx));
                plaque.h = Math.max(4, Math.round(sh0 + dy));
            } else { // tl
                const nx = Math.round(sx0 + dx);
                const ny = Math.round(sy0 + dy);
                const nw = Math.round(sw0 - dx);
                const nh = Math.round(sh0 - dy);
                if (nw >= 4 && nh >= 4) {
                    plaque.x = nx; plaque.y = ny;
                    plaque.w = nw; plaque.h = nh;
                }
            }
            renderPlaque();
        });
        h.addEventListener('pointerup', e => {
            resizing = false;
            h.releasePointerCapture(e.pointerId);
        });
        h.addEventListener('pointercancel', () => { resizing = false; });
    });

    document.getElementById('wIn').value = plaque.w;
    document.getElementById('hIn').value = plaque.h;
    renderPlaque();
}

function renderPlaque() {
    if (!plaque || !plaque.el) return;
    const s = scale;
    const el = plaque.el;
    el.style.left = (offsetX + plaque.x * s) + 'px';
    el.style.top  = (offsetY + plaque.y * s) + 'px';
    el.style.width  = (plaque.w * s) + 'px';
    el.style.height = (plaque.h * s) + 'px';
    el.querySelector('.label').textContent =
        `${plaque.id}  x=${plaque.x} y=${plaque.y} ${plaque.w}×${plaque.h}`;
    coordsEl.textContent = `x=${plaque.x} y=${plaque.y} w=${plaque.w} h=${plaque.h}`;
    // превью масштабируется под рамку автоматически (object-fit: fill)
}

document.getElementById('applySize').addEventListener('click', () => {
    if (!plaque) { alert('Сначала выбери скин справа'); return; }
    plaque.w = parseInt(document.getElementById('wIn').value) || plaque.w;
    plaque.h = parseInt(document.getElementById('hIn').value) || plaque.h;
    renderPlaque();
});

// «Центр на спрайт» — подсказка: центрируем плашку по видимой области в атласе
// (тут просто центрируем атлас на текущей плашке и слегка приближаем)
document.getElementById('centerOnSprite').addEventListener('click', () => {
    if (!plaque) return;
    const w = stage.clientWidth, h = stage.clientHeight;
    const zoom = 4;
    scale = zoom;
    offsetX = w / 2 - (plaque.x + plaque.w / 2) * scale;
    offsetY = h / 2 - (plaque.y + plaque.h / 2) * scale;
    applyTransform();
});

// ===== Список скинов =====
function renderSkinList() {
    const el = document.getElementById('skinList');
    el.innerHTML = '';
    if (catalog.length === 0) { el.textContent = '— пусто —'; return; }
    catalog.forEach(item => {
        const has = existing[item.id] || saved[item.id];
        const div = document.createElement('div');
        div.className = 'skinItem' + (activeSkin === item.id ? ' active' : '');
        div.innerHTML = `
            ${item.image ? `<img src="${item.image}" onerror="this.style.visibility='hidden'">` : '<div style="width:32px;height:24px"></div>'}
            <div class="nm">${item.name || item.id}</div>
            ${has ? '<div class="done">✓</div>' : ''}
        `;
        div.addEventListener('click', () => {
            activeSkin = item.id;
            activeItem = item;
            createPlaque(item);
            renderSkinList();
        });
        el.appendChild(div);
    });
}

// ===== Загрузка данных =====
async function loadWeapon(weaponName) {
    currentWeapon = weaponName;
    document.getElementById('weaponPicker').innerHTML =
        'оружие: ' + Object.keys(WEAPONS).map(w =>
            `<a href="#" data-w="${w}" style="color:${w===weaponName?'#FFD700':'#6a8aff'};margin:0 4px">${w}</a>`
        ).join('');
    document.querySelectorAll('#weaponPicker a').forEach(a => {
        a.addEventListener('click', e => {
            e.preventDefault();
            loadWeapon(a.dataset.w);
        });
    });

    const cfg = WEAPONS[weaponName];
    try { catalog = await (await fetch(cfg.catalog)).json(); } catch(e) { catalog = []; }
    try { existing = await (await fetch(cfg.atlas)).json(); } catch(e) { existing = {}; }
    saved = {};
    activeSkin = null;
    activeItem = null;
    if (plaque && plaque.el) { plaque.el.remove(); plaque = null; }
    renderSkinList();
    renderList();
}

function renderList() {
    const el = document.getElementById('list');
    const keys = Object.keys(saved);
    if (keys.length === 0) { el.textContent = '— пусто —'; return; }
    el.textContent = keys.map(k =>
        `${k}: { "x": ${saved[k].x}, "y": ${saved[k].y}, "w": ${saved[k].w}, "h": ${saved[k].h} }`
    ).join('\n');
}

// ===== Сохранить / Копировать / Очистить =====
document.getElementById('saveBtn').addEventListener('click', () => {
    if (!plaque) { alert('Сначала выбери скин'); return; }
    saved[plaque.id] = { x: plaque.x, y: plaque.y, w: plaque.w, h: plaque.h };
    renderList();
    renderSkinList();
});

document.getElementById('copyBtn').addEventListener('click', () => {
    const json = JSON.stringify(saved, null, 2);
    if (navigator.clipboard) {
        navigator.clipboard.writeText(json).then(
            () => alert('JSON скопирован в буфер'),
            () => prompt('Скопируй вручную:', json)
        );
    } else {
        prompt('Скопируй вручную:', json);
    }
});

document.getElementById('clearBtn').addEventListener('click', () => {
    if (!confirm('Очистить все сохранённые (в этом сеансе)?')) return;
    saved = {};
    renderList();
    renderSkinList();
});

// ===== Ресайз =====
addEventListener('resize', () => { fitToScreen(); renderPlaque(); });

// ===== Старт =====
loadWeapon('AK-47');
</script>
</body>
</html>
